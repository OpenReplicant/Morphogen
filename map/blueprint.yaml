# Blueprint: what Morphogen intends to be. Gated: change on a branch, merge
# after evals/gate passes and as autonomy allows. Backstage-style kinds plus
# provides/consumes, kpis, lock, docs and alternatives. Slots are components
# with status: empty.
#
# measured_by forms: eval:<check> (built-in, evals/run), cmd:<shell> (runs in
# the sandbox, prints a number), or prose (unmeasured: a gap in itself).

apiVersion: morphogen/v0
kind: System
metadata:
  name: morphogen
  description: An agent that maps itself as components with intent and replaces parts from catalogs.
spec:
  intent: map/intent.md

components:

  # ---- operator-owned: the frame everything else runs inside ----

  - name: operator-session
    kind: Component
    description: Interactive Claude Code session where the operator starts, directs and approves work.
    provides: [conversation, approvals, intent-edits]
    lock: locked
    docs: [https://code.claude.com/docs]

  - name: instructions
    kind: Resource
    description: CLAUDE.md, the agent's standing instructions and the core loop.
    path: CLAUDE.md
    lock: locked

  - name: intent
    kind: Resource
    description: Purpose, goals, hard limits, autonomy level and budgets.
    path: map/intent.md
    provides: [autonomy-level, budgets]
    kpis:
      - metric: autonomy level and sandbox declared
        target: pass
        measured_by: eval:autonomy_declared
    lock: locked

  - name: guard
    kind: Component
    description: Permission deny rules for locked paths, and the PreToolUse hook registration.
    path: .claude/settings.json
    provides: [lock-enforcement]
    kpis:
      - metric: locked paths with no deny rule
        target: "<= 0"
        measured_by: eval:lock_coverage
    lock: locked

  - name: guard-hook
    kind: Component
    description: Hooks that enforce locks (and undo shell writes to them), trunk protection, merge rules by autonomy, operator asks and the tool-call budget; also the session briefing and status line.
    path: tools/hooks/
    consumes: [autonomy-level, budgets, archive]
    provides: [lock-enforcement, trunk-protection, budget-enforcement, merge-control, session-briefing, status-line]
    lock: locked

  - name: ci-gate
    kind: Component
    description: GitHub workflow that runs the base's evals/gate on every pull request to the trunk; with branch protection, the judge no agent can reach.
    path: .github/
    consumes: [regression-gate, isolated-trials]
    provides: [remote-gate]
    lock: locked

  - name: evals
    kind: Component
    description: The judge. evals/run measures a tree; evals/gate compares HEAD with a base using the base's judge and KPI definitions, counts the trial budget, and archives the result.
    path: evals/
    provides: [kpi-measurement, regression-gate, archive, trial-budget]
    kpis:
      - metric: blueprint is well formed
        target: pass
        measured_by: eval:blueprint_valid
      - metric: journal only grows
        target: pass
        measured_by: eval:append_only
      - metric: locked paths unchanged by a candidate
        target: pass
        measured_by: eval:locked_untouched
      - metric: no lock loosened by a candidate
        target: pass
        measured_by: eval:locks_not_loosened
    lock: locked

  - name: sandbox
    kind: Component
    description: Runs trial commands in a container with no network, a read-only tree and resource limits.
    path: tools/sandbox/
    provides: [isolated-trials]
    version: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159, pyyaml 6.0.3
    lock: locked

  - name: devcontainer
    kind: Resource
    description: Session sandbox so Claude Code itself runs in a container, with the judge, guard, sandbox and git hooks and config mounted read-only.
    path: .devcontainer/
    provides: [isolated-session]
    alternatives: [Claude Code reference devcontainer with network firewall]
    lock: locked

  # ---- Morphogen's own machinery ----

  - name: onboard
    kind: Component
    description: Skill that interviews the operator and drafts the intent, then proposes the first gaps.
    path: .claude/skills/onboard/SKILL.md
    provides: [intent-draft]
    lock: gated

  - name: map-self
    kind: Component
    description: Skill that builds map/as-built.yaml and map/gaps.md.
    path: .claude/skills/map-self/SKILL.md
    provides: [as-built-map, gap-list]
    kpis:
      - metric: tracked files not covered by the blueprint
        target: "<= 0"
        measured_by: eval:unmapped_files
    lock: gated

  - name: evolve
    kind: Component
    description: Skill that closes one gap through the active strategy, the sandbox and the gate.
    path: .claude/skills/evolve/SKILL.md
    consumes: [gap-list, catalogs, improvement-strategy, isolated-trials, regression-gate]
    provides: [gap-closure]
    kpis:
      - metric: share of journal entries that generated rather than reused
        target: track only
        measured_by: eval:generated_share
    lock: gated

  - name: improvement-strategy
    kind: Component
    description: How parents and candidates are chosen. Never decides what is kept; the gate does.
    path: strategies/
    active: strategies/hill-climb.md
    provides: [improvement-strategy]
    interface: parent(archive) -> commit; candidates(gap, parent) -> changes; after(results)
    alternatives: [strategies/archive-search.md, strategies/red-queen.md, "catalogs.yaml strategies"]
    lock: gated

  - name: archive-tools
    kind: Component
    description: Lists archived variants (annotated tags archive/* written by evals/gate).
    path: tools/archive/
    consumes: [archive]
    lock: free

  - name: headless
    kind: Component
    description: One unattended pass of the loop with a dollar budget; needs autonomy 4.
    path: tools/headless
    consumes: [budgets]
    lock: gated

  - name: challenges
    kind: Resource
    description: Test cases for the intent's purpose, from the operator or the red-queen strategy. Data only.
    path: challenges/
    lock: gated

  - name: licence
    kind: Resource
    description: Apache 2.0 licence text.
    path: LICENSE
    lock: locked

  - name: notice
    kind: Resource
    description: Copyright and attribution notice.
    path: NOTICE
    lock: locked

  - name: readme
    kind: Resource
    description: What Morphogen is and how to start it, for people.
    path: README.md
    lock: gated

  - name: catalogs
    kind: Resource
    description: Where to search for existing parts and strategies before generating new ones.
    path: catalogs.yaml
    provides: [catalogs]
    lock: free

  - name: journal
    kind: Resource
    description: Append-only record of every change and why.
    path: journal/
    lock: free

# Slots: interfaces the system may fill when a gap needs them. Nothing is
# installed. Fill one only with a measured reason.
slots:

  - name: challenge-runner
    kind: Component
    status: empty
    description: Scores challenges/ cases against a tree and reports a pass rate for evals to read. Must be locked once filled.
    interface: run(cases, tree) -> pass_rate, per_case
    needed_by: [strategies/red-queen.md]

  - name: scheduler
    kind: Component
    status: empty
    description: Decides when tools/headless runs (autonomy 4 only).
    interface: schedule(job, when)
    alternatives: [cron, CI scheduled workflow, Claude Code scheduled tasks]

  - name: input-router
    kind: Component
    status: empty
    description: Sends each input to the cheapest handler that meets its accuracy and latency targets.
    interface: route(input) -> handler, with confidence

  - name: decision-handlers
    kind: Component
    status: empty
    description: Fast typed decisions (choice, score, probability) over state, with calibrated confidence.
    interface: ask(question, state) -> outcome, confidence, cost, latency
    alternatives: ["decision models (Jev, Clef, Strands Decider, d1)", "rules", "small trained classifiers"]

  - name: observers
    kind: Component
    status: empty
    description: Adapters that turn outside sources into events in one schema.
    interface: source -> events {id, time, source, type, payload, provenance}

  - name: event-matcher
    kind: Component
    status: empty
    description: Pattern rules over the event stream (filters, windows, sequences, absence).
    interface: events -> matches -> emit(question | event | action)

  - name: knowledge-store
    kind: Component
    status: empty
    description: Long-lived facts that change over time, with provenance and search.
    interface: ingest(episode), search(query), facts(entity, at_time)
    alternatives: [Graphiti, Cognee, plain files with indexes]
