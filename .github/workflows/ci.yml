name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      sandbox-postgres:                              # the sandbox's cluster: provider code never touches the record's (R5-26)
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5434:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false                 # no token in .git/config: the run users read the checkout
      - run: sudo apt-get install -y -q postgresql-client python3-venv nftables
      - name: gitleaks (the intake filter, R5-29), pinned by checksum
        run: |
          curl -sSLf -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - name: Contract requirements
        run: |
          python3 -m venv /tmp/kk-venv
          /tmp/kk-venv/bin/pip install -q -r kernel/contract/requirements.txt -r kernel/providers/kernel-mcp/requirements.txt \
            -r morphogen/modules/observer-otel/requirements.txt -r morphogen/modules/registry-lookup/requirements.txt
          echo "KK_PYTHON=/tmp/kk-venv/bin/python" >> "$GITHUB_ENV"
      - name: Conformance contract
        run: sh kernel/contract/run.sh
      - name: Mutation check (every mutant must fail)
        run: /tmp/kk-venv/bin/python kernel/contract/mutants.py
      - name: Provider tests (each provider's own, and the services end to end)
        run: /tmp/kk-venv/bin/python kernel/providers/test.py
      - name: Morphogen contract (its slots' case sets) and mutants
        run: sh morphogen/contract/run.sh && sh morphogen/contract/run.sh --mutants
      - name: Self-model questions, the reference agent and the grader's own test (R5-27)
        run: |
          /tmp/kk-venv/bin/python kernel/evals/self-model/run.py setup kk_eval_self
          /tmp/kk-venv/bin/python kernel/evals/self-model/run.py reference kk_eval_self
          /tmp/kk-venv/bin/python kernel/evals/self-model/test_grade.py kk_eval_self
          /tmp/kk-venv/bin/python morphogen/evals/self-model/run.py setup kk_eval_self_mg
          /tmp/kk-venv/bin/python morphogen/evals/self-model/run.py reference kk_eval_self_mg
      - name: The design eval's grader, on the scripted interviewer and two wrong ones (R5-29)
        run: /tmp/kk-venv/bin/python morphogen/evals/design/test_grade.py
      - name: OS users for model-written code (R5-24)
        run: |
          # uids of their own: --system would hand out 999, the uid Postgres runs as in the service container
          for i in 1 2 3 4; do sudo useradd --uid $((2900 + i)) --no-create-home --shell /usr/sbin/nologin kkrun$i; done
          # nothing a run leaves behind may run later (R5-26)
          for i in 1 2 3 4; do echo kkrun$i | sudo tee -a /etc/cron.deny /etc/at.deny > /dev/null; done
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          # the confined code reads the repository and the venv: every directory above them must be traversable
          d="$GITHUB_WORKSPACE"; while [ "$d" != / ]; do sudo chmod o+x "$d"; d=$(dirname "$d"); done
          chmod -R o+rX "$GITHUB_WORKSPACE" /tmp/kk-venv
      - name: Images for G3 (R5-25) and the local bring-up (T23), pulled with retries (Docker Hub rate-limits anonymous pulls)
        run: |
          for img in $(grep -ho 'image: .*' morphogen/intent/systems/*/compose.yaml | cut -d' ' -f2) \
                     $(grep -o '^IMAGE = "[^"]*"' morphogen/deploy/local.py | cut -d'"' -f2); do
            for i in 1 2 3 4; do docker pull -q "$img" && break; sleep $((i * 15)); done
          done
      - name: A browser for the UI test (T21), Playwright pinned
        run: |
          npm install --prefix /tmp/pw --no-save --no-audit --no-fund playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/pw-browsers /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          echo "NODE_PATH=/tmp/pw/node_modules" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=/tmp/pw-browsers" >> "$GITHUB_ENV"
      - name: Morphogen modules, the full loop (T5), G2, G3, the UI (T21) and the local bring-up (T23), as root so they can start code as the run users
        run: |
          # The passwords above are in this file, which the run users can read: replace them with ones they cannot.
          # The same for the sandbox's cluster.
          export PGPASSWORD_NEW=$(openssl rand -hex 24) SBX_PASSWORD=$(openssl rand -hex 24)
          echo "alter role postgres password '$PGPASSWORD_NEW'" | psql -d postgres -q
          echo "alter role postgres password '$SBX_PASSWORD'" | psql -p 5434 -d postgres -q
          export PGPASSWORD=$PGPASSWORD_NEW
          unset PGPASSWORD_NEW
          # The image trusts its local socket; confined runs refuse a cluster that trusts any connection.
          for c in ${{ job.services.postgres.id }} ${{ job.services.sandbox-postgres.id }}; do
            docker exec $c sh -c \
              'sed -i -E "s/[[:space:]]trust$/ scram-sha-256/" "$PGDATA/pg_hba.conf" && ! grep -Eq "^[^#].*[[:space:]]trust$" "$PGDATA/pg_hba.conf"'
          done
          psql -d postgres -qAtc "select pg_reload_conf()"
          PGPASSWORD=$SBX_PASSWORD psql -p 5434 -d postgres -qAtc "select pg_reload_conf()"
          export KK_SANDBOX_CLUSTER="host=localhost port=5434 user=postgres password=$SBX_PASSWORD"
          unset SBX_PASSWORD
          sudo -E env "PATH=$PATH" KK_RUN_AS=kkrun1,kkrun2,kkrun3,kkrun4 KK_REQUIRE_DOCKER=1 /tmp/kk-venv/bin/python morphogen/modules/test.py
      - name: Boundary
        run: python3 scripts/check_boundary.py
