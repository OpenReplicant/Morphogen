name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q postgresql-client python3-yaml
      - name: Conformance contract
        run: sh kernel/contract/run.sh
      - name: Boundary
        run: python3 scripts/check_boundary.py
