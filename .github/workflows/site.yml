# The research site (site/): build it from the claim, role and option files and deploy it to GitHub Pages.
# Not enabled: it runs only when started by hand, and deploying needs Pages turned on with "GitHub Actions" as its
# source (Settings > Pages). To deploy on every change to main, add the `push` trigger below.
name: research-site
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: [site/**, demos/research-loop/**, schemas/evidence-claim.v1.json, .github/workflows/site.yml]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24.5.0
      - name: Install the site's packages (exact versions from site/package-lock.json)
        working-directory: site
        run: npm ci --ignore-scripts --no-fund
      - name: Install PyYAML for the tests (a venv; hash-locked wheels only)
        run: |
          python3 -m venv "$RUNNER_TEMP/site"
          "$RUNNER_TEMP/site/bin/pip" install --quiet --only-binary=:all: --require-hashes -r requirements.lock
      - name: Test the build (each test runs it)
        env:
          MORPHOGEN_SITE_TESTS: "1"
        run: '"$RUNNER_TEMP/site/bin/python" -m unittest tests.test_site -v'
      - name: Build
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
