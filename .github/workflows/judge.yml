# Judges every pull request to main from outside the agent's reach.
#
# The candidate's code runs against the BASE's tests and sample targets
# (including the red-team suite of known cheats), so a change cannot weaken
# the tests that judge it. Make "judge" a required status check on main with
# branch protection, and no change reaches main without passing it.
name: judge
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:   # runs the containers job; judge runs on every trigger
permissions:
  contents: read
jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the base's tests and samples
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout "$BASE" -- server/tests samples/targets
          echo "Judging with the tests and samples of $BASE"
          git status --short
      - name: Install uv
        run: pipx install uv==0.11.32
      - name: Tests, red team and strategy selection
        working-directory: server
        run: uv run --project . python -m unittest -v tests.test_morphogen tests.test_redteam tests.test_strategies

  # The same suites with every trial inside a container, plus checks that the
  # runner's claimed guarantees (no network, read-only tree, memory limit,
  # nothing kept between runs) hold. ubuntu-24.04 ships Docker and Podman.
  # About 10 minutes per engine, so it runs only when started by hand
  # (Actions > judge > Run workflow), e.g. after changing the runner.
  containers:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the base's tests and samples
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout "$BASE" -- server/tests samples/targets
          echo "Judging with the tests and samples of $BASE"
          git status --short
      - name: Install uv
        run: pipx install uv==0.11.32
      - name: Pull the trial image
        run: ${{ matrix.engine }} pull docker.io/library/python:3.12-slim
      - name: Tests, red team and strategy selection in ${{ matrix.engine }}
        working-directory: server
        env:
          MORPHOGEN_TEST_SANDBOX: ${{ matrix.engine }}
        run: uv run --project . python -m unittest -v tests.test_morphogen tests.test_redteam tests.test_redteam_open tests.test_strategies
