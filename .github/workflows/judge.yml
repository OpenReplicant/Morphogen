# Tests every pull request to main. Advisory for now (rebuild 7 is still settling):
#
# - `judge` runs the candidate's own tests and red team. It is the check main requires.
# - `base-tests` runs the BASE's red team against the candidate, so a change cannot quietly
#   weaken the judge: every cheat the base refuses must still be refused. Only the red team, not
#   the base's whole suite: an intended change to tested behaviour (a new tool, a new field) would
#   fail the base's other tests every time, and a check that always fails is not read.
#
# To make the base's tests binding again, add `base-tests` to main's required checks.
name: judge
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.11.32
      - name: Tests and red team
        run: uv run --extra optuna --extra gepa python -m unittest discover -s tests -t . -v

  base-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the base's tests
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE:tests" 2>/dev/null; then
            # Replace the directory whole: a checkout on top would keep the candidate's own test
            # files, which then import from the base's fixtures (#64 failed this way).
            rm -rf tests
            git checkout "$BASE" -- tests
            echo "Testing the candidate with the tests of $BASE"
          else
            echo "The base has no tests/ yet; using the candidate's"
          fi
          git status --short
      - name: Install uv
        run: pipx install uv==0.11.32
      - name: The base's red team, against the candidate
        run: uv run --extra optuna --extra gepa python -m unittest -v tests.test_redteam
