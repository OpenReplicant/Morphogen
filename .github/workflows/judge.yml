# Judges every pull request to main from outside the agent's reach.
#
# The candidate's code runs against the BASE's tests and sample targets
# (including the red-team suite of known cheats), so a change cannot weaken
# the tests that judge it. Make "judge" a required status check on main with
# branch protection, and no change reaches main without passing it.
name: judge
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:   # judge runs on every trigger; these choose the costly jobs
    inputs:
      containers:
        description: Run the suites with trials inside Docker and Podman (about 10 minutes each)
        type: boolean
        default: true
      eval_loop:
        description: Run eval 03, one full round of the loop, with Claude Code (needs the ANTHROPIC_API_KEY secret; costs model usage)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the base's tests and samples
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout "$BASE" -- server/tests samples/targets
          echo "Judging with the tests and samples of $BASE"
          git status --short
      - name: Install uv
        run: pipx install uv==0.11.32
      - name: Tests, red team and strategy selection
        working-directory: server
        run: uv run --project . python -m unittest -v tests.test_morphogen tests.test_redteam tests.test_strategies

  # The same suites with every trial inside a container, plus checks that the
  # runner's claimed guarantees (no network, read-only tree, memory limit,
  # nothing kept between runs) hold. ubuntu-24.04 ships Docker and Podman.
  # About 10 minutes per engine, so it runs only when started by hand
  # (Actions > judge > Run workflow), e.g. after changing the runner.
  containers:
    if: github.event_name == 'workflow_dispatch' && inputs.containers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the base's tests and samples
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout "$BASE" -- server/tests samples/targets
          echo "Judging with the tests and samples of $BASE"
          git status --short
      - name: Install uv
        run: pipx install uv==0.11.32
      - name: Pull the trial image
        run: ${{ matrix.engine }} pull docker.io/library/python:3.12-slim
      - name: Tests, red team and strategy selection in ${{ matrix.engine }}
        working-directory: server
        env:
          MORPHOGEN_TEST_SANDBOX: ${{ matrix.engine }}
        run: uv run --project . python -m unittest -v tests.test_morphogen tests.test_redteam tests.test_strategies

  # One full round of the loop (eval 03): onboarded project, map, candidates on
  # branches, judge, proposal. The only end-to-end check, and it needs a
  # non-root machine: in a root container the eval sandbox made .git read-only.
  # Started by hand (Actions > judge > Run workflow, tick eval_loop).
  eval-loop:
    if: github.event_name == 'workflow_dispatch' && inputs.eval_loop
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.11.32
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.317
      - name: Sandbox prerequisites
        # The eval sandbox uses bubblewrap; Ubuntu 24.04 restricts the user
        # namespaces it needs unless this sysctl is turned off.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap socat
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Prepare the plugin copy
        run: |
          printf 'link-mode = "copy"\n' > server/uv.toml
          git config --global user.email "eval@example.com"
          git config --global user.name "eval"
      - name: Eval 03, one round of the loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          claude plugin eval . --case 03-evolve-one-round --scaffold --mocks off
          --trust-plugin --no-publish --runs 1 --threshold 0.8 --max-cost-usd 5
          --model claude-sonnet-5-5 --judge-model claude-sonnet-5-5
          --allow-tools mcp__plugin_morphogen_morphogen "Bash(git:*)" "Bash(python:*)" "Bash(python3:*)" Write Edit
