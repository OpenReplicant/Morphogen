# The Morphogen judge for GitHub Actions, as a reusable workflow. A consumer calls it from its own
# `pull_request_target` workflow (templates/github/morphogen.yml), so every job's definition is the
# base's: a pull request cannot edit what judges it. The candidate's code runs only in the `run` job,
# inside one `--network none` container per case; that job holds no secrets. `admit` and `score`
# hold the secrets (through the `morphogen-judge` environment) and never run the candidate.
name: morphogen-judge
on:
  workflow_call:
    inputs:
      judge-ref:
        description: The Morphogen commit to judge with. Must equal the commit in the caller's `uses:` line.
        required: true
        type: string
      cases-repo:
        description: owner/name of the repository holding the held-out case sets (MORPHOGEN_CASES_TOKEN must read and write it). Empty means this repository.
        required: false
        type: string
        default: ""
      cases-branch:
        required: false
        type: string
        default: main
      cases-sealed:
        description: The case sets are sealed (judge/custody.py) under the MORPHOGEN_CASES_KEY secret, so the store may be public.
        required: false
        type: boolean
        default: false
      subdir:
        description: The directory, relative to the repository root, that the sandbox runs the module from.
        required: false
        type: string
        default: "."
      module:
        description: The Python module the sandbox runs (`python -I -m`-style, from `subdir`).
        required: true
        type: string
      sandbox-image:
        description: The image each case runs in, pinned by digest.
        required: false
        type: string
        default: python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
      case-timeout:
        required: false
        type: number
        default: 60
      verdict-poster:
        description: "Who posts `morphogen/verdict`. `actions`: the workflow token (anyone with write access can post the same status). `app`: a GitHub App only the judge holds the key of; require the status from that app in the ruleset."
        required: false
        type: string
        default: actions
      signing:
        description: "`key`: a cosign key pair held in the environment. `keyless`: the workflow's OIDC identity, logged in the public Sigstore transparency log."
        required: false
        type: string
        default: keyless
    # Callers pass these with `secrets: inherit` (set them on the morphogen-judge environment or the
    # repository). Only `admit` and `score` read them.
    secrets:
      MORPHOGEN_CASES_TOKEN:
        description: Reads (and, for the served count, writes) the case repository. Needed unless the store is this repository.
        required: false
      MORPHOGEN_CASES_KEY:
        description: Opens sealed case sets (`cases-sealed`).
        required: false
      MORPHOGEN_COSIGN_KEY:
        required: false
      MORPHOGEN_COSIGN_PASSWORD:
        required: false
      MORPHOGEN_APP_CLIENT_ID:
        description: "The judge's GitHub App client ID (with verdict-poster app)."
        required: false
      MORPHOGEN_APP_KEY:
        description: "The judge's GitHub App private key (with verdict-poster app)."
        required: false

permissions: {}

concurrency:
  group: morphogen-judge-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_REF: ${{ github.event.pull_request.base.ref }}

jobs:
  admit:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    environment: morphogen-judge
    permissions:
      contents: read
    outputs:
      admitted: ${{ steps.admit.outputs.admitted }}
      judged: ${{ steps.admit.outputs.judged }}
      base: ${{ steps.fetch.outputs.base }}
      inputs-artifact: ${{ steps.up-inputs.outputs.artifact-id }}
    steps:
      - name: Get the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: openreplicant/morphogen
          ref: ${{ inputs.judge-ref }}
          path: .judge
          persist-credentials: false
      - name: Install the judge (a venv; hash-locked wheels only)
        run: |
          python3 -m venv "$RUNNER_TEMP/mg"
          "$RUNNER_TEMP/mg/bin/pip" install --quiet --only-binary=:all: --require-hashes -r .judge/requirements.lock
          echo "$RUNNER_TEMP/mg/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.judge" >> "$GITHUB_ENV"
      - id: fetch
        name: Fetch base and candidate as git objects (the candidate is never checked out)
        env:
          GIT_TOKEN: ${{ github.token }}
        run: >-
          python3 -m judge.ci fetch --server "$GITHUB_SERVER_URL" --repo "$GITHUB_REPOSITORY" --pr "$PR"
          --base-ref "$BASE_REF" --head-sha "$HEAD_SHA" --trees base --admit --token-env GIT_TOKEN --workdir w
      - id: admit
        name: Admit
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # A change that touches nothing in the policy's scope is not judged: no run, no cases, and a
          # signed "pass (not judged)", unless it touches what the judge relies on (then refused).
          if python3 -m judge.admit --repo w/repo --base refs/mg/base --head refs/mg/head \
               --policy w/base/.morphogen/policy.json --card-out admission.json; then
            echo "admitted=true" >> "$GITHUB_OUTPUT"
          else
            echo "admitted=false" >> "$GITHUB_OUTPUT"
          fi
          echo "judged=$(jq -r '.judged' admission.json)" >> "$GITHUB_OUTPUT"
      - name: Hand the run its inputs, never the answers
        if: steps.admit.outputs.judged == 'true'
        env:
          CASES_TOKEN: ${{ secrets.MORPHOGEN_CASES_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          CASES_KEY: ${{ secrets.MORPHOGEN_CASES_KEY }}
          CASES_REPO: ${{ inputs.cases-repo || github.repository }}
          CASES_BRANCH: ${{ inputs.cases-branch }}
          SEALED: ${{ inputs.cases-sealed }}
        run: |
          # The workflow's own token only ever reaches this repository; another store needs the case token.
          if [ -z "$CASES_TOKEN" ]; then
            if [ "$CASES_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::MORPHOGEN_CASES_TOKEN is not available to this job; the caller must pass secrets (secrets: inherit)"; exit 1
            fi
            CASES_TOKEN="$REPO_TOKEN"
          fi
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$CASES_TOKEN" | base64 -w0)" \
            clone -q --depth 1 --single-branch --branch "$CASES_BRANCH" "$GITHUB_SERVER_URL/$CASES_REPO.git" cases
          plain=cases
          if [ "$SEALED" = true ]; then python3 -m judge.custody open --key-env CASES_KEY --sealed cases --plain plain; plain=plain; fi
          python3 -m judge.ci inputs --cases-dir "$plain" --admission admission.json --out inputs.jsonl
          rm -rf cases plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: admission
          path: admission.json
          retention-days: 1
      # The held-out inputs travel alone, so the score job can delete them as soon as the run is over:
      # anyone who can read the repository can download a run's artifacts.
      - id: up-inputs
        if: steps.admit.outputs.judged == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: inputs
          path: inputs.jsonl
          retention-days: 1

  run:
    needs: admit
    if: needs.admit.outputs.admitted == 'true' && needs.admit.outputs.judged == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runs-artifact: ${{ steps.up-runs.outputs.artifact-id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: inputs
          path: in
      - name: Get the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: openreplicant/morphogen
          ref: ${{ inputs.judge-ref }}
          path: .judge
          persist-credentials: false
      - name: Install the judge (a venv; hash-locked wheels only)
        run: |
          python3 -m venv "$RUNNER_TEMP/mg"
          "$RUNNER_TEMP/mg/bin/pip" install --quiet --only-binary=:all: --require-hashes -r .judge/requirements.lock
          echo "$RUNNER_TEMP/mg/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.judge" >> "$GITHUB_ENV"
      - name: Fetch both trees as files (no hooks, no .git)
        env:
          GIT_TOKEN: ${{ github.token }}
          BASE: ${{ needs.admit.outputs.base }}
        run: >-
          python3 -m judge.ci fetch --server "$GITHUB_SERVER_URL" --repo "$GITHUB_REPOSITORY" --pr "$PR"
          --base-ref "$BASE_REF" --head-sha "$HEAD_SHA" --expect-base "$BASE" --token-env GIT_TOKEN --workdir w
      - name: Pull the sandbox image (the candidate's containers get no network)
        env:
          IMAGE: ${{ inputs.sandbox-image }}
        run: docker pull --quiet "$IMAGE"
      - name: Run base and candidate in pairs, one sandbox container per case, the order in each pair by coin flip
        env:
          IMAGE: ${{ inputs.sandbox-image }}
          MODULE: ${{ inputs.module }}
          SUBDIR: ${{ inputs.subdir }}
          CASE_TIMEOUT: ${{ inputs.case-timeout }}
        run: |
          case "/$SUBDIR/" in */../*|//*) echo "bad subdir"; exit 1;; esac
          # The measurer is the base's: its own harness if it has one, else the judge's (rail 1).
          set --
          if [ -f w/base/.morphogen/harness.py ]; then set -- --harness w/base/.morphogen/harness.py; fi
          python3 -m judge.run --base "w/base/$SUBDIR" --candidate "w/candidate/$SUBDIR" --inputs in/inputs.jsonl \
            --image "$IMAGE" --module "$MODULE" --out-dir out --timeout "$CASE_TIMEOUT" "$@"
      - id: up-runs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: runs
          path: out
          retention-days: 1

  score:
    needs: [admit, run]
    if: always() && needs.admit.result == 'success'
    runs-on: ubuntu-24.04
    environment: morphogen-judge
    permissions:
      contents: read
      statuses: write
      id-token: write
      actions: write  # only to delete this run's inputs and run records
    steps:
      # By name: with a single artifact (admission refused, run skipped), an unnamed download lands
      # its files directly in `path`, so the layout would depend on what ran.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: admission
          path: art/admission
      - if: needs.run.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: runs
          path: art/runs
      - name: Delete the held-out inputs and the run records from the run (the outputs echo the inputs)
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ needs.admit.outputs.inputs-artifact }} ${{ needs.run.outputs.runs-artifact }}
        run: |
          # Fails the job (and so the verdict becomes a stop) if the case data cannot be removed.
          for id in $IDS; do
            for try in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id")
              case "$code" in 204|404) echo "artifact $id removed ($code)"; continue 2;; esac
              sleep $((try * 3))
            done
            echo "::error::could not delete artifact $id (HTTP $code); the caller must grant actions: write"; exit 1
          done
      - name: Get the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: openreplicant/morphogen
          ref: ${{ inputs.judge-ref }}
          path: .judge
          persist-credentials: false
      - name: Install the judge (a venv; hash-locked wheels only)
        run: |
          python3 -m venv "$RUNNER_TEMP/mg"
          "$RUNNER_TEMP/mg/bin/pip" install --quiet --only-binary=:all: --require-hashes -r .judge/requirements.lock
          echo "$RUNNER_TEMP/mg/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.judge" >> "$GITHUB_ENV"
      - name: Fetch the base as files
        env:
          GIT_TOKEN: ${{ github.token }}
          BASE: ${{ needs.admit.outputs.base }}
        run: >-
          python3 -m judge.ci fetch --server "$GITHUB_SERVER_URL" --repo "$GITHUB_REPOSITORY" --pr "$PR"
          --base-ref "$BASE_REF" --head-sha "$HEAD_SHA" --expect-base "$BASE" --trees base --token-env GIT_TOKEN --workdir w
      - id: claim
        name: Fetch the held-out cases and claim this verdict's place in the count
        if: needs.admit.outputs.judged == 'true'
        env:
          CASES_TOKEN: ${{ secrets.MORPHOGEN_CASES_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          CASES_KEY: ${{ secrets.MORPHOGEN_CASES_KEY }}
          CASES_REPO: ${{ inputs.cases-repo || github.repository }}
          CASES_BRANCH: ${{ inputs.cases-branch }}
          SEALED: ${{ inputs.cases-sealed }}
        run: |
          # The workflow's own token only ever reaches this repository; another store needs the case token.
          if [ -z "$CASES_TOKEN" ]; then
            if [ "$CASES_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::MORPHOGEN_CASES_TOKEN is not available to this job; the caller must pass secrets (secrets: inherit)"; exit 1
            fi
            CASES_TOKEN="$REPO_TOKEN"
          fi
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$CASES_TOKEN" | base64 -w0)" \
            clone -q --single-branch --branch "$CASES_BRANCH" "$GITHUB_SERVER_URL/$CASES_REPO.git" cases
          if [ "$SEALED" = true ]; then
            python3 -m judge.custody open --key-env CASES_KEY --sealed cases --plain plain
          else
            ln -s cases plain
          fi
          export CASES_TOKEN
          python3 -m judge.ci claim --cases-dir cases --admission art/admission/admission.json --token-env CASES_TOKEN \
            --branch "$CASES_BRANCH"
      - name: Score
        env:
          BASE: ${{ needs.admit.outputs.base }}
          SERVED: ${{ steps.claim.outputs.served }}
        run: |
          mkdir -p art/runs
          python3 -m judge.score --base-checkout w/base --cases-dir plain --base-run art/runs/base.jsonl \
            --candidate-run art/runs/candidate.jsonl --admission art/admission/admission.json --served "${SERVED:-0}" \
            --repository "$GITHUB_REPOSITORY" --pull-request "$PR" --base-sha "$BASE" --head-sha "$HEAD_SHA" \
            --out verdict.json
          rm -rf cases plain
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign
        env:
          SIGNING: ${{ inputs.signing }}
          COSIGN_KEY: ${{ secrets.MORPHOGEN_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.MORPHOGEN_COSIGN_PASSWORD }}
        run: |
          if [ "$SIGNING" = keyless ]; then
            cosign sign-blob --yes --bundle verdict.sigstore.json verdict.json
          else
            umask 077 && printf '%s' "$COSIGN_KEY" > "$RUNNER_TEMP/k"
            echo '{"mediaType":"application/vnd.dev.sigstore.signingconfig.v0.2+json","rekorTlogConfig":{},"tsaConfig":{}}' > "$RUNNER_TEMP/sc.json"
            cosign sign-blob --yes --key "$RUNNER_TEMP/k" --signing-config "$RUNNER_TEMP/sc.json" --bundle verdict.sigstore.json verdict.json
            rm -f "$RUNNER_TEMP/k"
          fi
      - id: app
        name: Get the judge's GitHub App token (statuses only)
        if: inputs.verdict-poster == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.MORPHOGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MORPHOGEN_APP_KEY }}
          permission-statuses: write
      - name: Post the verdict
        env:
          POSTER: ${{ inputs.verdict-poster }}
          GH_TOKEN: ${{ inputs.verdict-poster == 'app' && steps.app.outputs.token || github.token }}
        run: |
          case "$POSTER" in app|actions) ;; *) echo "::error::verdict-poster must be app or actions"; exit 1;; esac
          python3 -m judge.ci post --api "$GITHUB_API_URL" --repo "$GITHUB_REPOSITORY" --verdict verdict.json \
            --token-env GH_TOKEN --target-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 -m judge.ci summary --verdict verdict.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verdict
          path: |
            verdict.json
            verdict.sigstore.json

  report:
    # When the judge itself fails, say so on the commit: a `stop`, never a pass, and never silence.
    needs: [admit, run, score]
    if: always() && github.event_name == 'pull_request_target' && needs.score.result != 'success'
    runs-on: ubuntu-24.04
    environment: morphogen-judge
    permissions:
      statuses: write
      actions: write  # only to delete this run's inputs and run records
    steps:
      - name: Delete the held-out inputs and the run records, if the score job did not
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ needs.admit.outputs.inputs-artifact }} ${{ needs.run.outputs.runs-artifact }}
        run: |
          # Fails the job (and so the verdict becomes a stop) if the case data cannot be removed.
          for id in $IDS; do
            for try in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id")
              case "$code" in 204|404) echo "artifact $id removed ($code)"; continue 2;; esac
              sleep $((try * 3))
            done
            echo "::error::could not delete artifact $id (HTTP $code); the caller must grant actions: write"; exit 1
          done
      - id: app
        if: inputs.verdict-poster == 'app'
        continue-on-error: true  # a stop may be posted by either token: it can only block a merge
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.MORPHOGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MORPHOGEN_APP_KEY }}
          permission-statuses: write
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          RESULTS: "admit=${{ needs.admit.result }} run=${{ needs.run.result }} score=${{ needs.score.result }}"
        run: |
          body=$(jq -n --arg d "stop: the judge failed ($RESULTS); no verdict" \
            --arg u "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:"failure", context:"morphogen/verdict", description:$d[0:138], target_url:$u}')
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -d "$body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA"
          echo "posted morphogen/verdict=failure (stop: $RESULTS)"
