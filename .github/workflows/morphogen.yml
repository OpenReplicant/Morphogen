# Dogfood: the rebuild-8 judge (pinned by commit) judges pull requests that touch the toy in dogfood/.
# Definition from the base branch (pull_request_target), so a pull request cannot change it.
name: morphogen
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths: ["dogfood/**", ".morphogen/**"]
permissions: {}
jobs:
  judge:
    uses: OpenReplicant/Morphogen/.github/workflows/judge.yml@86c99b2a744d64de40c3ab5d3c8ccb949bab191b
    permissions: {contents: read, statuses: write, id-token: write}
    secrets: inherit
    with: {judge-ref: 86c99b2a744d64de40c3ab5d3c8ccb949bab191b, cases-repo: OpenReplicant/morphogen-judge, subdir: dogfood, module: topwords}
