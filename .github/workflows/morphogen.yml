# Dogfood: the rebuild-8 judge (pinned by commit) sees every pull request to main. Those touching the
# toy in dogfood/topwords are judged; the rest get a signed "pass (not judged)", or a refusal if they
# touch the judge's own ground (workflows, .morphogen/, protected paths), which a person then merges
# by the ruleset's bypass. GitHub takes a pull_request_target workflow from the default branch whatever
# the pull request's base, so `branches` keeps this caller to pull requests into main.
name: morphogen
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions: {}
jobs:
  judge:
    uses: OpenReplicant/Morphogen/.github/workflows/judge.yml@b921c9b34970d5896cf8e2f1ecd436cf53788444
    permissions: {contents: read, statuses: write, id-token: write, actions: write}
    secrets: inherit
    with: {judge-ref: b921c9b34970d5896cf8e2f1ecd436cf53788444, cases-repo: OpenReplicant/morphogen-judge, subdir: dogfood, module: topwords, verdict-poster: app}
