# Dogfood: the rebuild-8 judge (pinned by commit) judges pull requests that touch the toy in dogfood/.
# Definition from the base branch (pull_request_target), so a pull request cannot change it.
name: morphogen
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths: ["dogfood/**", ".morphogen/**"]
permissions: {}
jobs:
  judge:
    uses: OpenReplicant/Morphogen/.github/workflows/judge.yml@99c2ca10abb1cf769cdb47e34d8d7264aae4ef0a
    permissions: {contents: read, statuses: write, id-token: write}
    secrets: inherit
    with: {judge-ref: 99c2ca10abb1cf769cdb47e34d8d7264aae4ef0a, cases-repo: OpenReplicant/morphogen-judge, subdir: dogfood, module: topwords, verdict-poster: app}
