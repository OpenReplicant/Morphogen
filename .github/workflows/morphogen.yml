# Dogfood: the rebuild-8 judge (pinned by commit) sees every pull request to main. Those touching the
# toy in dogfood/topwords are judged; the rest get a signed "pass (not judged)", or a refusal if they
# touch the judge's own ground (workflows, .morphogen/, protected paths), which a person then merges
# by the ruleset's bypass. Definition from the base branch (pull_request_target).
name: morphogen
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions: {}
jobs:
  judge:
    uses: OpenReplicant/Morphogen/.github/workflows/judge.yml@0017015f776b9e9c1ca7cc92fa325f1a1f6065ec
    permissions: {contents: read, statuses: write, id-token: write}
    secrets: inherit
    with: {judge-ref: 0017015f776b9e9c1ca7cc92fa325f1a1f6065ec, cases-repo: OpenReplicant/morphogen-judge, subdir: dogfood, module: topwords, verdict-poster: app}
