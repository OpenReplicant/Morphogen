# Dogfood: the rebuild-8 judge (pinned by commit) judges pull requests that touch the toy in dogfood/.
# Definition from the base branch (pull_request_target), so a pull request cannot change it.
name: morphogen
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths: ["dogfood/**", ".morphogen/**"]
permissions: {}
jobs:
  judge:
    uses: OpenReplicant/Morphogen/.github/workflows/judge.yml@eb7ec0581435ce45b8e50d26a64bbe22e8855698
    permissions: {contents: write, statuses: write, id-token: write}
    with: {judge-ref: eb7ec0581435ce45b8e50d26a64bbe22e8855698, cases-branch: morphogen-cases, cases-sealed: true, subdir: dogfood, module: topwords}
