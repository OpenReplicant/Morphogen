# Dogfood: the rebuild-8 judge (pinned by commit) judges pull requests that touch the toy in dogfood/.
# Definition from the base branch (pull_request_target), so a pull request cannot change it.
name: morphogen
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths: ["dogfood/**", ".morphogen/**"]
permissions: {}
jobs:
  judge:
    uses: OpenReplicant/Morphogen/.github/workflows/judge.yml@016fff4bca294c8896fe0abdff068bb507231cff
    permissions: {contents: read, statuses: write, id-token: write}
    secrets: inherit
    with: {judge-ref: 016fff4bca294c8896fe0abdff068bb507231cff, cases-repo: OpenReplicant/morphogen-judge, subdir: dogfood, module: topwords}
