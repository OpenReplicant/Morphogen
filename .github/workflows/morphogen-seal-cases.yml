# One-off: create the dogfood's held-out case set, sealed, on the branch morphogen-cases. The cases are
# generated from fresh randomness inside this run and sealed under MORPHOGEN_CASES_KEY (environment
# morphogen-judge), so their plaintext exists nowhere else. Refuses if the branch already exists.
# Run by hand: Actions -> morphogen-seal-cases -> Run workflow.
name: morphogen-seal-cases
on: workflow_dispatch
permissions: {}
jobs:
  seal:
    runs-on: ubuntu-24.04
    environment: morphogen-judge
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {repository: OpenReplicant/Morphogen, ref: eb7ec0581435ce45b8e50d26a64bbe22e8855698, path: .judge, persist-credentials: false}
      - run: |
          python3 -m venv "$RUNNER_TEMP/mg"
          "$RUNNER_TEMP/mg/bin/pip" install --quiet --only-binary=:all: --require-hashes -r .judge/requirements.lock
      - env:
          GH_TOKEN: ${{ github.token }}
          CASES_KEY: ${{ secrets.MORPHOGEN_CASES_KEY }}
        run: |
          set -eu
          auth="http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if git -c "$auth" ls-remote --exit-code --heads "$url" morphogen-cases >/dev/null; then
            echo "morphogen-cases exists; not overwriting"; exit 1
          fi
          plain="$RUNNER_TEMP/plain"
          SEED="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            python3 dogfood/make_cases.py --seed-env SEED --out "$plain/topwords-heldout"
          PYTHONPATH=.judge "$RUNNER_TEMP/mg/bin/python" -m judge.custody seal --key-env CASES_KEY --plain "$plain" --sealed store
          rm -rf "$plain"
          echo 0 > store/topwords-heldout/served
          cd store
          git init -q -b morphogen-cases
          git add -A
          git -c user.name=morphogen-judge -c user.email=judge@invalid commit -qm "topwords-heldout: 30 sealed cases"
          git -c "$auth" push -q "$url" morphogen-cases
          echo "sealed case set pushed to morphogen-cases"
