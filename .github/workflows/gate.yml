# The gate, run by GitHub outside the agent's reach. Locked.
# Make "gate" a required status check on the trunk with branch protection, and
# no merge to the trunk can skip the judge. Active once Morphogen is the root of
# its own repository.
#
# pull_request_target runs this file as it is on the base branch, so a pull
# request cannot rewrite its own check. The candidate is only read as data, and
# its cmd: KPIs run in the networkless sandbox. No secrets, read-only token.
name: gate
on:
  pull_request_target:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the judge's one dependency
        run: pip install pyyaml==6.0.3
      - name: Build the sandbox from the base's Dockerfile
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/$BASE"
          "$RUNNER_TEMP/base/tools/sandbox/build"
      - name: Judge with the base's gate
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git config user.name gate && git config user.email gate@localhost
          python3 "$RUNNER_TEMP/base/evals/gate" --repo . --base "origin/$BASE" --no-archive
