asyncapi: 3.0.0
info:
  title: Morphogen intake
  version: 0.1.0
  description: CloudEvents accepted by the Morphogen intake (HTTP binary or structured mode). Telemetry uses OTLP via the OTel Collector and is not listed here.
  license:
    name: Apache-2.0
defaultContentType: application/cloudevents+json
servers:
  local:
    host: intake.localhost
    protocol: http
    pathname: /events
channels:
  events:
    address: /events
    messages:
      blueprintSubmitted:
        $ref: '#/components/messages/blueprintSubmitted'
      proposalCreated:
        $ref: '#/components/messages/proposalCreated'
      findingCreated:
        $ref: '#/components/messages/findingCreated'
      assertionCreated:
        $ref: '#/components/messages/assertionCreated'
      proposalDecided:
        $ref: '#/components/messages/proposalDecided'
      intentCommitted:
        $ref: '#/components/messages/intentCommitted'
  otlp:
    address: /otlp/v1/traces
    description: OTLP/HTTP traces (protobuf or JSON) from the OTel Collector only; the trace ingestor turns spans into observed slots and couplings.
  completions:
    address: /completions
    description: Published by ingestors after every pipeline run; watchers subscribe.
    messages:
      pipelineCompleted:
        $ref: '#/components/messages/pipelineCompleted'
operations:
  submitEvent:
    action: receive
    channel:
      $ref: '#/channels/events'
  publishCompletion:
    action: send
    channel:
      $ref: '#/channels/completions'
components:
  messages:
    blueprintSubmitted:
      name: org.openreplicant.morphogen.blueprint.submitted
      payload:
        $ref: '../schemas/events/blueprint-submitted.schema.json'
    proposalCreated:
      name: org.openreplicant.morphogen.proposal.created
      payload:
        $ref: '../schemas/events/proposal-created.schema.json'
    findingCreated:
      name: org.openreplicant.morphogen.finding.created
      payload:
        $ref: '../schemas/events/finding-created.schema.json'
    assertionCreated:
      name: org.openreplicant.morphogen.assertion.created
      payload:
        $ref: '../schemas/events/assertion-created.schema.json'
    proposalDecided:
      name: org.openreplicant.morphogen.proposal.decided
      description: A reviewer's decision. Not accepted at /events; sent as POST /review/decisions behind forward_auth, which sets source person:<Remote-User>.
      payload:
        $ref: '../schemas/events/proposal-decided.schema.json'
    intentCommitted:
      name: org.openreplicant.morphogen.intent.committed
      description: Published in-process by the promoter after writing approved files to intent/. Not accepted from outside.
      payload:
        $ref: '../schemas/events/intent-committed.schema.json'
    pipelineCompleted:
      name: org.openreplicant.morphogen.pipeline.completed
      payload:
        $ref: '../schemas/events/pipeline-completed.schema.json'
