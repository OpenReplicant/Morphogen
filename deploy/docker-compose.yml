# Local stack for Milestone 1. Verify image tags during the spike.
name: morphogen

services:
  postgres:
    # Needs pgvector + Apache AGE. Build deploy/postgres/Dockerfile or swap for an image that has both.
    build: ./postgres
    environment:
      POSTGRES_USER: morphogen
      POSTGRES_PASSWORD: morphogen
      POSTGRES_DB: morphogen
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morphogen"]
      interval: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]

  intake:
    build: ..
    command: ["uv", "run", "uvicorn", "morphogen.intake.app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DB_PROVIDER: postgres
      DB_HOST: postgres
      DB_NAME: morphogen
      DB_USERNAME: morphogen_ingestor
      DB_PASSWORD: change-me
      VECTOR_DB_PROVIDER: pgvector
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: morphogen-intake
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8080:8080"]

  postgrest:
    image: postgrest/postgrest:latest
    environment:
      PGRST_DB_URI: postgres://morphogen_reader:change-me@postgres:5432/morphogen
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: morphogen_reader
    depends_on:
      postgres: { condition: service_healthy }

  caddy:
    image: caddy:2
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../ui:/srv/ui:ro
    ports: ["80:80", "443:443"]
    depends_on: [intake, postgrest]

volumes:
  pgdata:
