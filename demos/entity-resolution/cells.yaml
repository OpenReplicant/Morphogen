# The demo's intended structure, in the draft format from the root BRIEF.md. Nothing reads it yet.
cells:
  er:                                    # the root: the resolver as a whole
    at: er/
    provides: [resolver]
    consumes: [candidates, pair-score]   # Base.resolve and Base.add use both
    measure: bench.py
    cases: {search: "bench.py --split search", holdout: "bench.py --split holdout"}

  blocking:
    parent: er
    at: er/base.py#Base.candidates
    modality: code
    provides: [candidates]
    parameters:
      block_max_df: {file: er/settings.py, name: BLOCK_MAX_DF, owner: agent, range: [0.01, 0.5]}
      block_limit:  {file: er/settings.py, name: BLOCK_LIMIT, owner: agent, range: [5, 200]}

  matcher:
    parent: er
    at: er/base.py#Base.pair
    modality: code
    provides: [pair-score]
    consumes: [similarity]
    parameters:
      threshold:      {file: er/settings.py, name: THRESHOLD, owner: agent, range: [0.5, 0.99]}
      model_mismatch: {file: er/settings.py, name: MODEL_MISMATCH, owner: agent, range: [0.0, 1.0]}
      word_mismatch:  {file: er/settings.py, name: WORD_MISMATCH, owner: agent, range: [0.0, 1.0]}
      typo_ratio:     {file: er/settings.py, name: TYPO_RATIO, owner: agent, range: [0.6, 1.0]}
      aliases:        {file: er/settings.py, name: ALIASES, owner: operator}
      stopwords:      {file: er/settings.py, name: STOPWORDS, owner: operator}

  backend:
    parent: er
    at: er/backends/
    modality: alternatives
    provides: [similarity]
    parameters:
      backend: {file: er/settings.py, name: BACKEND, owner: agent, choices: [overlap, tfidf]}

  clustering:                            # intended, not built: entities are grouped in er/base.py
    parent: er
    modality: code
    consumes: [pair-score]

interfaces:
  resolver:                              # the root's boundary: the Resolver protocol
    external: consumes                   # used by whatever needs resolution
    tests: [python -m unittest discover -s tests]
  candidates:   {tests: []}              # no contract tests yet: an intent-coverage gap
  pair-score:   {tests: []}
  similarity:   {tests: []}
