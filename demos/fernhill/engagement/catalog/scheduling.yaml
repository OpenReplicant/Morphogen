# Options for the role `job-scheduling` (catalog/tools.yaml), found 2026-11-24 (the catalog skill).
# The need, written before looking: (1) `fitting-schedule`: each job's fitting pair, address, days, quartz
# template date and parts, across multi-day jobs; (2) the fitters read it on their own Android phones; (3)
# `xero-invoices`: a signed-off job's final invoice reaches Xero without retyping; (4) no server to run; (5) "a few
# hundred pounds a month if it pays for itself", for about 9 people (2 directors, 1 office, 2 designers, 4 fitters).
# Measured by: fitting starts that slip (48% now), double-bookings (two this year, the operator), days from sign-off
# to final invoice (median 12.5 now). Ruled out: anything self-hosted (need 4; material/tools.md:L21).
