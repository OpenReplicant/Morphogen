apiVersion: morphogen.dev/v1alpha1
kind: EvidenceClaim
metadata:
  name: e04a-lfm3-coverage
  description: >-
    At 5% risk LFM3 (debiased and scaled) covers 0.09 of cases, Jev 0.67.
spec:
  about: component:default/likelihood-readout
  role: component:default/decision-backend
  source:
    kind: trial
    title: "E-04a: local models read as decision models, against Jev"
    id: E-04a
    url: https://github.com/OpenReplicant/MetaSoar/blob/facbe842bcc0778afc2fbe2a9801cd9895d46fab/trials/decision-readout/README.md
    version: facbe842bcc0778afc2fbe2a9801cd9895d46fab
    repository: OpenReplicant/MetaSoar
    commit: facbe842bcc0778afc2fbe2a9801cd9895d46fab
    path: trials/decision-readout/README.md
    location: Results so far, the LFM3 table, row LFM3 debiased and scaled
    read: in full
    quote: >-
      | LFM3, debiased and scaled | 0.528 [0.508, 0.547] | 0.553 | 0.026 | 0.09 (0.072) |
    quote_location: Results so far, the LFM3 table, row LFM3 debiased and scaled
    quote_status: checked
    quote_note: Matched against the file at the commit by check.py --metasoar (whitespace collapsed).
  claim:
    statement: >-
      With its 5%-risk threshold chosen on the fit half, LFM3 debiased and scaled acts on 0.09 of eval cases (realised
      risk 0.072), against Jev's 0.67 (realised risk 0.050): about a seventh of Jev's coverage, and above the target risk.
    metric: coverage at 5% risk
    better: higher
    value: 0.09
    where: all ten slices pooled, debiased and scaled
    baseline: {name: Jev 1.13, value: 0.67}
    finding: worse
    runs: 1
    cases: 3412
    reporting: ours
    also:
      - {metric: realised risk at the 5% threshold, better: lower, value: 0.072, baseline: {name: Jev 1.13, value: 0.050}}
  conditions:
    models:
      - name: LFM3 1.7B
        ref: resource:default/lfm3-1.7b-q6-k
        size: 1.7B
        precision: Q6_K
        tuned: untuned
        capability: the owner notes it beats 12B and 14B models on general benchmarks; the note cites no benchmark
    engine: {name: llama.cpp server, version: "b12627 (Substrate image server-cuda12-b12627)", ref: resource:default/llama-cpp-b12627}
    dataset:
      name: JevBench (Leanmcp)
      version: ed50fe0
      split: the eval half of families, by a hash; each temperature and 5%-risk threshold chosen on the fit half
      size: 3,412 eval cases of 6,516 usable, ten slices (SST-5 and BANKING77 left out)
      ref: resource:default/jevbench-ed50fe0
    method: >-
      The question's instructions, the state as JSON and the options labelled A, B, C..., ending "Reply with the
      letter of one option only"; `Answer:` prefilled; one token generated and its top 50 log-probabilities kept;
      the option letters renormalised (an option outside the top 50 gets half the smallest listed). Two reads per
      case, options in order and reversed. Debiased is the mean of both orders; scaled adds one temperature per slice.
    thinking: off (enable_thinking false)
    hardware: {name: NVIDIA GTX 1070, memory: 8 GB, ref: resource:default/gtx-1070}
    reference: Jev 1.13, djev 0.1 and Laya 421M, their own probabilities as shipped with the cases
    runs_note: one read per case and order; the intervals are 95% from resampling families
