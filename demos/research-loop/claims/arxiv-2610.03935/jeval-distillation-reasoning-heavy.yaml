apiVersion: morphogen.dev/v1alpha1
kind: EvidenceClaim
metadata:
  name: jeval-distillation-reasoning-heavy
  description: >-
    Distillation recovers most of what thinking adds on label selection, but a quarter or less on reasoning-heavy sets (GPQA, MMLU-Pro).
spec:
  about: component:default/self-distilled-readout
  role: component:default/decision-backend
  source:
    kind: preprint
    title: "General Decision Models: Benchmarking and Insights Beyond Jev (JEVal)"
    id: arXiv:2610.03935
    url: https://arxiv.org/pdf/2610.03935
    version: v2
    location: not stated in the note
    read: the abstract, the experiments and sections 6 to 9 (as the note says)
    quote: ""
    quote_status: none
    quote_note: The note paraphrases the paper and quotes none of it; the paper's own words are still to be taken and checked.
    via:
      title: MetaSoar docs/decision-backends.md
      url: https://github.com/OpenReplicant/MetaSoar/blob/92105f815c6c2691288c162a40f376be4dd564bb/docs/decision-backends.md
      repository: OpenReplicant/MetaSoar
      commit: 92105f815c6c2691288c162a40f376be4dd564bb
      path: docs/decision-backends.md
      location: What was measured elsewhere, JEVal, third bullet
      quote: >-
        Distillation recovers most of what thinking adds on label selection (intent, harm, emotion), but **a quarter or less on reasoning-heavy sets** (GPQA, MMLU-Pro): one pass does not reproduce multi-step computation.
  claim:
    statement: >-
      A distilled one-pass readout recovers most of what thinking adds on label selection (intent, harm, emotion),
      but a quarter or less on reasoning-heavy sets (GPQA, MMLU-Pro): one pass does not reproduce multi-step
      computation.
    metric: share of thinking's gain recovered
    better: higher
    value: {min: 0, max: 0.25, over: "reasoning-heavy sets (GPQA, MMLU-Pro): a quarter or less"}
    baseline: {name: the same model with thinking}
    finding: worse
    runs: null
    cases: null
    reporting: unknown
  conditions:
    models:
      - {name: SII-Decision (4B and 27B), tuned: self-distilled}
    engine: {name: vLLM}
    hardware: {name: H100}
    dataset: {name: JEVal, size: "11,257 items from 36 datasets, 25 configurations"}
    method: first-token readout after self-distillation, against the same model thinking
  assessments:
    - system: system:default/metasoar
      against: [resource:default/lfm3-1.7b-q6-k, resource:default/inkling-2-mini-q4-k, resource:default/llama-cpp-b12627, resource:default/gtx-1070]
      status: predicted
      prediction:
        p_transfer: 0.7
        reason: >-
          A limit of one forward pass, not of model size, so it should hold for a small model too. Consistent but not
          a test: E-04a's untuned readout was already far below Jev on MedQA, MedMCQA and MMLU-Pro.
        by: agent draft for research-loop phase 0, from the note's table ("Readout replaces thinking on reasoning-heavy questions" marked no); not yet reviewed by the owner
        date: 2026-11-25
        before_outcome: true
      see_also: [e04a-lfm3-slices]
      date: 2026-11-25
