apiVersion: morphogen.dev/v1alpha1
kind: EvidenceClaim
metadata:
  name: tableroute-computational-support
  description: Removing the deterministic computations (counts, sums, averages, differences added as context) cost
    TableRoute 2.0 points on WikiTableQuestions and 2.1 on WTQ-L.
spec:
  about: component:default/computed-table-statistics
  role: component:default/table-qa
  source:
    kind: preprint
    title: 'TableRoute: Capability-Aware Routing for Scalable Table Question Answering'
    id: arXiv:2611.25853
    url: https://arxiv.org/abs/2611.25853v1
    version: v1
    location: Section 6, Table 5 (ablations)
    read: abstract, introduction, analysis, main results and ablations (sections 1 to 6)
    quote: Computational support contributes 2.0 and 2.1 points on WikiTQ and WTQ-L, respectively.
    quote_location: 'arXiv HTML #S5.SS4.SSS0.Px3.p1.1'
    quote_status: checked
    quote_note: matched against the paper's text (html, sha256 dbb6579ec227) by morphogen.research html_to_text
      v1, after NFKC and with quotes, dashes and whitespace made plain
  claim:
    statement: Removing the deterministic computations (counts, sums, averages, differences added as context) cost
      TableRoute 2.0 points on WikiTableQuestions and 2.1 on WTQ-L.
    metric: exact-match accuracy lost without the computations
    better: higher
    value: null
    baseline:
      name: TableRoute without computational support
    finding: better
    effect_size:
      value: 2.0
      kind: absolute
      note: points on WikiTQ; 2.1 on WTQ-L
    runs: null
    cases: null
    reporting: self
  conditions:
    models:
    - name: the paper's base LLMs (70B and GPT-4o-mini)
    dataset:
      name: WikiTableQuestions and WTQ-L
    method: an ablation of TableRoute's evidence layer
    unstated:
    - which base model the ablation used
  assessments:
  - system: system:default/metasoar
    against:
    - resource:default/lfm3-1.7b-q6-k
    - resource:default/inkling-2-mini-q4-k
    - resource:default/llama-cpp-b12627
    - resource:default/gtx-1070
    status: predicted
    prediction:
      p_transfer: 0.5
      reason: A second, independent paper on the same option (see tablerouter-statistics-double-accuracy), and on
        WTQ itself. The gain is small for large models; for our smaller ones it may be larger, but that is the other
        paper's evidence, not this one's.
      by: research-loop agent draft (Claude Opus 5.5, Claude Code), from the paper and MetaSoar's docs/experiments.md
        at 22feddc; not yet reviewed by the owner
      date: '2026-11-27'
      before_outcome: true
    trial:
      plan: The same trial as tablerouter-statistics-double-accuracy settles both.
      cost_hours: 4
      needs:
      - that trial
    date: '2026-11-27'
