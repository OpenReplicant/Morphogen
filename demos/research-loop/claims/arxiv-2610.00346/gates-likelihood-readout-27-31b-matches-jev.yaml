apiVersion: morphogen.dev/v1alpha1
kind: EvidenceClaim
metadata:
  name: gates-likelihood-readout-27-31b-matches-jev
  description: Read by the likelihood of each option key, Gemma-4-31B and Qwen3.6-27B matched Jev; Qwen3-14B and Mistral-Small-24B did not.
spec:
  about: component:default/likelihood-readout
  role: component:default/decision-backend
  source:
    kind: preprint
    title: Benchmarking System One decision models against trained classifiers and language models for automated decision gates
    id: arXiv:2610.00346
    url: https://arxiv.org/html/2610.00346v2
    version: v2
    location: not stated in the note (from section 6, the conclusion or the tables)
    read: section 6 and the conclusion in full, the tables partly (as the note says)
    quote: ""
    quote_status: none
    quote_note: The note paraphrases the paper and quotes none of it; the paper's own words are still to be taken and checked.
    via:
      title: MetaSoar docs/decision-backends.md
      url: https://github.com/OpenReplicant/MetaSoar/blob/92105f815c6c2691288c162a40f376be4dd564bb/docs/decision-backends.md
      repository: OpenReplicant/MetaSoar
      commit: 92105f815c6c2691288c162a40f376be4dd564bb
      path: docs/decision-backends.md
      location: What was measured elsewhere, Decision gates, second bullet
      quote: >-
        Gemma-4-31B and Qwen3.6-27B read by the likelihood of each option key matched Jev; Qwen3-14B and
        Mistral-Small-24B stayed significantly below it. No generative model under 14B was tested.
  claim:
    statement: >-
      Without labels, an untuned generative model read by the likelihood of each option key matches Jev for some
      checkpoints (Gemma-4-31B, Qwen3.6-27B) and stays significantly below it for others (Qwen3-14B,
      Mistral-Small-24B): it depends on the checkpoint, not on the class. No generative model under 14B was tested.
    metric: accuracy
    better: higher
    value: null
    baseline: {name: Jev, value: null}
    finding: matches
    significance: the 14B and 24B models "stayed significantly below" Jev (the note's words)
    runs: null
    cases: null
    reporting: independent
    note: The note gives no numbers for this claim; the finding is for the 27B and 31B models only.
  conditions:
    models:
      - {name: Gemma-4-31B, size: 31B, precision: bf16, tuned: untuned (open generative model)}
      - {name: Qwen3.6-27B, size: 27B, precision: FP8, tuned: untuned (open generative model)}
      - {name: Qwen3-14B, size: 14B, precision: AWQ 4-bit, tuned: untuned; below Jev}
      - {name: Mistral-Small-24B, size: 24B, precision: bf16, tuned: untuned; below Jev}
    engine: {name: vLLM}
    dataset: {name: "the gates paper's decision tasks (the note names CLINC-150, workflow decisions, emotion and intent; which ones this finding covers is not stated)"}
    method: the likelihood of each option key; every model given the same requests
    labels: none used by the readout
    unstated: [the prompt, which tasks the match holds on, hardware, the number of cases]
  assessments:
    - system: system:default/metasoar
      against: [resource:default/lfm3-1.7b-q6-k, resource:default/llama-cpp-b12627, resource:default/gtx-1070, resource:default/jevbench-ed50fe0]
      status: did-not-transfer
      outcome:
        trial:
          id: E-04a
          url: https://github.com/OpenReplicant/MetaSoar/tree/facbe842bcc0778afc2fbe2a9801cd9895d46fab/trials/decision-readout
          repository: OpenReplicant/MetaSoar
          commit: facbe842bcc0778afc2fbe2a9801cd9895d46fab
          path: trials/decision-readout/README.md
        observed: [e04a-lfm3-pooled-accuracy, e04a-lfm3-coverage]
        summary: >-
          LFM3 1.7B Q6_K, read the same way (first token, untuned), debiased over both option orders and scaled with
          one temperature per slice: pooled accuracy 0.528 [0.508, 0.547] against Jev 1.13's 0.842 [0.828, 0.857] on
          the same 3,412 JevBench cases, and coverage at 5% risk 0.09 against 0.67. Its calibration error matched
          Jev's after scaling (0.026 against 0.024), so the gap is accuracy, not calibration.
        comparison: our-setup
        verdict:
          by: falsifier
          decision: met
          ref: OpenReplicant/MetaSoar@facbe842bcc0778afc2fbe2a9801cd9895d46fab:docs/experiments.md (E-04a)
          note: >-
            Registered before the outcome: pooled accuracy more than 10 points below Jev's, or coverage at 5% risk
            under half of Jev's, after debiasing and one temperature per slice. Both limbs are met.
        date: 2026-11-25
      reason: >-
        No probability was written before the trial: the note's table had "LFM3 1.7B read that way is good enough"
        as open, so this outcome does not count towards calibration. A transfer test, not a replication: a 1.7B
        model untuned, on llama.cpp at Q6_K, on JevBench rather than the paper's tasks. A 1.7B model is below the
        paper's smallest (14B), so this does not test the 27B and 31B finding itself; Inkling 2 Mini (the next
        assessment) does. Tuning the readout (prompt, then self-distillation) is the cell's next step.
      see_also: [e04a-lfm3-slices, probe-lfm3-first-token]
      date: 2026-11-25
    - system: system:default/metasoar
      against: [resource:default/inkling-2-mini-q4-k, resource:default/llama-cpp-b12627, resource:default/gtx-1070, resource:default/jevbench-ed50fe0]
      status: replicated
      outcome:
        trial:
          id: E-04a
          url: https://github.com/OpenReplicant/MetaSoar/blob/22feddc6fa29682e94c2f62fe25da93b559980ab/trials/decision-readout/README.md
          repository: OpenReplicant/MetaSoar
          commit: 22feddc6fa29682e94c2f62fe25da93b559980ab
          path: trials/decision-readout/README.md
        observed: [e04a-inkling-pooled-accuracy]
        summary: >-
          Inkling 2 Mini Q4_K (a mixture of experts of about 26B in all), read the same way, untuned, debiased and
          scaled: pooled accuracy 0.810 [0.775, 0.843] against Jev 1.13's 0.843 [0.813, 0.873] on the same 779
          JevBench cases, 3.3 points below (paired, [-6.5, -0.3]), and coverage at 5% risk 0.51 against 0.64. On the
          same 779 cases d1-2B reached 0.633 and LFM3 0.561. Near Jev, not equal to it: the paired interval excludes
          zero, so "matches" holds here in the sense E-04a registered (within 10 points, coverage above half of Jev's).
        comparison: our-setup
        verdict:
          by: falsifier
          decision: not met
          ref: OpenReplicant/MetaSoar@22feddc6fa29682e94c2f62fe25da93b559980ab:docs/experiments.md (E-04a)
          note: >-
            The same falsifier as for LFM3, registered before the outcome: pooled accuracy more than 10 points below
            Jev's, or coverage at 5% risk under half of Jev's. Neither limb is met (3.3 points; 0.51 against 0.64).
        date: 2026-11-26
      reason: >-
        No probability was written before the trial, so this outcome does not count towards calibration. A transfer
        test at about the paper's size (26B in all against 27B and 31B), on a mixture of experts at Q4_K, on
        llama.cpp and JevBench, on a sample of 100 families per slice. The trial reads it the same way: Inkling is at
        "the size at which the decision-gate study found likelihood readouts matching Jev".
      date: 2026-11-26
