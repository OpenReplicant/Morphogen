apiVersion: morphogen.dev/v1alpha1
kind: EvidenceClaim
metadata:
  name: gates-order-effects-untrained
  description: >-
    Swapping yes and no flipped at least 16.8 answers per hundred for every generative model, at most 6.5 for fine-tuned decision checkpoints.
spec:
  about: component:default/likelihood-readout
  role: component:default/decision-backend
  source:
    kind: preprint
    title: Benchmarking System One decision models against trained classifiers and language models for automated decision gates
    id: arXiv:2610.00346
    url: https://arxiv.org/html/2610.00346v2
    version: v2
    location: not stated in the note (from section 6, the conclusion or the tables)
    read: section 6 and the conclusion in full, the tables partly (as the note says)
    quote: ""
    quote_status: none
    quote_note: The note paraphrases the paper and quotes none of it; the paper's own words are still to be taken and checked.
    via:
      title: MetaSoar docs/decision-backends.md
      url: https://github.com/OpenReplicant/MetaSoar/blob/92105f815c6c2691288c162a40f376be4dd564bb/docs/decision-backends.md
      repository: OpenReplicant/MetaSoar
      commit: 92105f815c6c2691288c162a40f376be4dd564bb
      path: docs/decision-backends.md
      location: What was measured elsewhere, Decision gates, fifth bullet
      quote: >-
        Swapping yes and no flipped at least 16.8 answers per hundred for every generative model, against at most 6.5 for fine-tuned decision checkpoints (and 50.5 for Jev).
  claim:
    statement: >-
      Order effects are large for untrained readers: swapping yes and no flipped at least 16.8 answers per hundred
      for every generative model, against at most 6.5 for fine-tuned decision checkpoints (and 50.5 for Jev).
    metric: answers flipped by swapping yes and no
    better: lower
    unit: per hundred
    value: 16.8
    baseline: {name: fine-tuned decision checkpoints (at most), value: 6.5}
    finding: worse
    runs: null
    cases: null
    reporting: independent
    also:
      - {metric: answers flipped by swapping yes and no, unit: per hundred, value: 50.5, where: Jev}
    note: >-
      16.8 is a floor (the lowest of the four generative models), not one model's figure. The note reports Jev's 50.5 without comment; it is higher than every other figure here.
  conditions:
    models:
      - {name: Qwen3-14B, size: 14B, precision: AWQ 4-bit, tuned: untuned}
      - {name: Qwen3.6-27B, size: 27B, precision: FP8, tuned: untuned}
      - {name: Gemma-4-31B, size: 31B, precision: bf16, tuned: untuned}
      - {name: Mistral-Small-24B, size: 24B, precision: bf16, tuned: untuned}
    engine: {name: vLLM}
    method: yes and no swapped in yes-or-no decisions
  assessments:
    - system: system:default/metasoar
      against: [resource:default/lfm3-1.7b-q6-k, resource:default/llama-cpp-b12627, resource:default/gtx-1070, resource:default/jevbench-ed50fe0]
      status: replicated
      outcome:
        trial:
          id: E-04a
          url: https://github.com/OpenReplicant/MetaSoar/tree/facbe842bcc0778afc2fbe2a9801cd9895d46fab/trials/decision-readout
          repository: OpenReplicant/MetaSoar
          commit: facbe842bcc0778afc2fbe2a9801cd9895d46fab
          path: trials/decision-readout/README.md
        observed: [e04a-lfm3-order-flip]
        summary: >-
          LFM3 1.7B untuned flipped 0.327 of its answers pooled (32.7 per hundred) when the options were reversed,
          and 0.667 on MMLU-Pro: well above the paper's floor for untrained readers. The measures differ: E-04a
          reverses every option's position, on choice and yes-or-no questions alike, where the paper swapped yes and no.
        comparison: our-setup
        verdict:
          by: none
          decision: no verdict
          note: E-04a's falsifier is on accuracy and coverage; this record reads the order-flip rate against the claim.
        date: 2026-11-25
      reason: No probability was written before the trial.
      date: 2026-11-25
