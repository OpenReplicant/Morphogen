apiVersion: morphogen.dev/v1alpha1
kind: EvidenceClaim
metadata:
  name: tablerouter-statistics-double-accuracy
  description: Given the same answer-determining rows, adding statistics computed from them raised Qwen2.5-7B's
    accuracy from 40.0% to 80.0% and Llama-3.1-8B's from 37.8% to 71.1% on 45 count and sum questions; Qwen3.5-9B
    went from 86.7% to 93.3%.
spec:
  about: component:default/computed-table-statistics
  role: component:default/table-qa
  source:
    kind: preprint
    title: 'TableRouter: Query-Aware Evidence Construction for Long-Table Question Answering'
    id: arXiv:2611.32006
    url: https://arxiv.org/abs/2611.32006v1
    version: v1
    location: Section 5, Table 3 (the fixed-row experiment)
    read: abstract, introduction, method and main results (sections 1 to 5)
    quote: When the same answer-determining rows are provided, adding their computed statistics doubles Qwen2.5-7B
      accuracy from 40.0% to 80.0% (+40.0 points)
    quote_location: 'arXiv HTML #S6.SS1.p1.1'
    quote_status: checked
    quote_note: matched against the paper's text (html, sha256 a5608dfacf69) by morphogen.research html_to_text
      v1, after NFKC and with quotes, dashes and whitespace made plain
  claim:
    statement: Given the same answer-determining rows, adding statistics computed from them raised Qwen2.5-7B's
      accuracy from 40.0% to 80.0% and Llama-3.1-8B's from 37.8% to 71.1% on 45 count and sum questions; Qwen3.5-9B
      went from 86.7% to 93.3%.
    metric: accuracy
    better: higher
    value: 0.8
    baseline:
      name: the same rows without the statistics
      value: 0.4
    finding: better
    effect_size:
      value: 40.0
      kind: absolute
      note: points
    runs: null
    cases: 45
    reporting: self
    also:
    - metric: accuracy
      better: higher
      value: 0.711
      baseline:
        name: rows alone
        value: 0.378
      where: Llama-3.1-8B
    - metric: accuracy
      better: higher
      value: 0.933
      baseline:
        name: rows alone
        value: 0.867
      where: Qwen3.5-9B
    note: The 45 questions were chosen by their gold queries (41 counts, 4 sums), and the statistics may contain
      the answer itself, as the paper says.
  conditions:
    models:
    - name: Qwen2.5-7B-Instruct
      size: 7B
      tuned: untuned
    - name: Llama-3.1-8B-Instruct
      size: 8B
      tuned: untuned
    - name: Qwen3.5-9B
      size: 9B
      tuned: untuned
    engine:
      name: vLLM
    dataset:
      name: BirdQA-R (BIRD single-table questions)
      size: 45 gold-selected questions
    method: one call to a frozen model; an explanation-first prompt; greedy decoding
    thinking: non-thinking mode (Qwen3.5-9B)
    unstated:
    - precision
    - hardware for this experiment
  assessments:
  - system: system:default/metasoar
    against:
    - resource:default/lfm3-1.7b-q6-k
    - resource:default/inkling-2-mini-q4-k
    - resource:default/llama-cpp-b12627
    - resource:default/gtx-1070
    status: predicted
    prediction:
      p_transfer: 0.55
      reason: 'Our template rung has LFM3 1.7B follow a plan over the table, and E-17c''s two shuffle errors were
        LFM3 reading a table by row position: the kind of evidence-use failure the statistics fix. The models here
        are 7B to 9B and ours smaller, which the paper''s own gradient (largest gain for the weaker models) favours.
        Against it: WTQ''s tables are short, the 45 questions were picked so the statistics help, and many WTQ questions
        are lookups.'
      by: research-loop agent draft (Claude Opus 5.5, Claude Code), from the paper and MetaSoar's docs/experiments.md
        at 22feddc; not yet reviewed by the owner
      date: '2026-11-27'
      before_outcome: true
    trial:
      plan: 'On E-18''s pilot cases (dev1k) that the template rung answers: LFM3 with the table alone against the
        table plus a line of statistics computed for the question''s column and condition (counts, sums, extrema);
        accuracy by WTQ''s evaluator, paired.'
      cost_hours: 4
      needs:
      - a statistics line builder (from TableRouter's rules
      - Appendix B)
      - E-18's template prompts
    date: '2026-11-27'
