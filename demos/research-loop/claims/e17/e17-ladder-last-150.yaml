apiVersion: morphogen.dev/v1alpha1
kind: EvidenceClaim
metadata:
  name: e17-ladder-last-150
  description: >-
    Over the last 150 of a 300-case TabMWP stream, templates and handlers answered 58.7% of cases; accuracy 98.0% against Inkling alone's 99.3%, -1.3 points [-3.3, +0.0].
spec:
  about: component:default/handler-ladder
  role: component:default/intent-handler
  source:
    kind: trial
    title: "E-17: the handler ladder on TabMWP"
    id: E-17
    url: https://github.com/OpenReplicant/MetaSoar/blob/22feddc6fa29682e94c2f62fe25da93b559980ab/docs/experiments.md
    version: 22feddc6fa29682e94c2f62fe25da93b559980ab
    repository: OpenReplicant/MetaSoar
    commit: 22feddc6fa29682e94c2f62fe25da93b559980ab
    path: docs/experiments.md
    location: docs/experiments.md, row E-17
    read: the row in full, and trials/handler-ladder/README.md
    quote: >-
      over the last 150, templates and handlers answered 58.7% (chunks: 24%, 45%, 64%); accuracy 98.0% against Inkling alone's 99.3%, -1.3 points [-3.3, +0.0], so a loss over 2 points is not excluded
    quote_location: docs/experiments.md, row E-17, the outcome
    quote_status: checked
    quote_note: Matched against the file at the commit by check.py --metasoar (whitespace collapsed).
  claim:
    statement: >-
      On the last 150 cases of a 300-case TabMWP stream, the handler ladder answered 58.7% of cases with templates and
      handlers, at 98.0% accuracy against the large model alone's 99.3% on the same cases: -1.3 points, with a 95%
      interval of [-3.3, +0.0], so a loss over 2 points is not excluded. E-17's falsifier is not met.
    metric: accuracy
    better: higher
    unit: percent
    value: 98.0
    where: the last 150 cases of the stream
    baseline: {name: Inkling alone on the same cases, value: 99.3}
    finding: matches
    effect_size: {value: -1.3, kind: absolute, note: "percentage points, paired; 95% interval [-3.3, +0.0]"}
    significance: a loss over 2 points is not excluded (the row's words)
    runs: 1
    cases: 150
    reporting: ours
    also:
      - {metric: share of cases answered by templates and handlers, better: higher, unit: percent, value: 58.7, where: "the last 150; chunks of 100: 24%, 45%, 64%"}
      - {metric: Inkling calls a case, better: lower, value: 0.50, where: chunk 3}
      - {metric: wall seconds a case, better: lower, value: 21.9, baseline: {name: Inkling alone, value: 22.4}}
    note: >-
      Model calls fell but wall time did not (handler writes, shadow labels and LFM3 on every case). The two errors
      were promoted handlers, each on 3 agreements of 3. Design details were tuned on stream cases, so E-17b tests
      fresh ones.
  conditions:
    models:
      - name: Inkling 2 Mini
        ref: resource:default/inkling-2-mini-q4-k
        size: about 26B in all (a mixture of experts)
        precision: Q4_K
        tuned: untuned
        capability: the large model; it solves what no cheaper rung holds, and its answers are the only labels
      - name: LFM3 1.7B
        ref: resource:default/lfm3-1.7b-q6-k
        size: 1.7B
        precision: Q6_K
        tuned: untuned
        capability: the small model; names intents (E-17 to E-17c) and follows plan templates
    engine: {name: llama.cpp server, version: "b12627 (Substrate image server-cuda12-b12627)", ref: resource:default/llama-cpp-b12627}
    dataset:
      name: TabMWP
      version: 5a1a522
      split: test1k, the first 300 of a fixed random order, in chunks of 100; measured on the last 150
      ref: resource:default/tabmwp-5a1a522
    method: >-
      An intent elaborator names each case's intent (an exact key); each case goes to the cheapest rung that holds for its intent (a Python handler over the table, a plan template the small model follows, the large model); after enough of one intent's cases the large model writes a template and a handler, each promoted only on agreement with the large model's earlier answers on that intent, and falling back to the large model when it raises or its answer fails a check. Promotion at 95% agreement or more (3 of 3 at the least).
    thinking: off (Inkling reasoning_effort none; LFM3 enable_thinking false)
    hardware: {name: NVIDIA GTX 1070, memory: 8 GB, ref: resource:default/gtx-1070}
    labels: none; promotion is on agreement with the large model's own answers, and only the summary reads gold
    unstated: [TabMWP is generated from templates, so intents recur by construction; the result is for the mechanism, not real work]
