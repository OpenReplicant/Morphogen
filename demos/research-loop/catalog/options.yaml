apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: handler-ladder
  description: >-
    MetaSoar's own method, not a paper's: name each case's intent, send it to the cheapest rung that holds for that
    intent (a written handler, a plan template, the large model), and promote a handler or template only on agreement
    with the large model's own answers, never gold labels.
spec:
  type: method
  lifecycle: candidate
  owner: group:default/metasoar
  morphogen:
    fills: component:default/intent-handler
    evaluation:
      need: >-
        E-17's falsifier, inverted: templates and handlers answer at least 30% of a stream's later cases, with
        accuracy there not more than 2 points below the large model alone (paired, 95% interval).
      method: E-17 to E-17d, MetaSoar trials/handler-ladder at 22feddc (stream.py, stream_v2.py, perturb.py)
      result: >-
        Met on E-17's own stream (58.7%, -1.3 points). On fresh cases it lost accuracy (E-17b, -5.3 points); the
        stricter rules that removed the loss also removed nearly all cheap answers (E-17d, 8.7%).
      evidence:
        - claims/e17/e17-ladder-last-150.yaml
        - claims/e17/e17b-ladder-fresh-cases.yaml
        - claims/e17/e17c-ladder-perturbed.yaml
        - claims/e17/e17d-ladder-strict-promotion.yaml
