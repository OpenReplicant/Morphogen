# The options: one Component with spec.lifecycle: candidate per method the session's papers measured (and one of
# MetaSoar's own, handler-ladder), for the role it could fill. Each lists its claim files (claims/,
# schemas/evidence-claim.v1.json) in spec.morphogen.evaluation.evidence; check.py keeps that list equal to the claims whose `about`
# names the option. Where the method came from is the claims' business; the evidence annotation only says where it is
# described.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: likelihood-readout
  description: >-
    Read a generative model as a decision model: one forward pass, no thinking, the probability of each option's key
    (its first token) renormalised over the options. Untuned.
spec:
  type: method
  lifecycle: candidate
  owner: group:default/metasoar
  morphogen:
    fills: component:default/decision-backend
    evaluation:
      need: >-
        E-04a's falsifier, inverted: after debiasing and one temperature per slice, pooled accuracy within 10 points
        of Jev's and coverage at 5% risk at least half of Jev's, on the JevBench cases.
      method: E-04a, MetaSoar trials/decision-readout at facbe84 (readout.py, serve.sh, score.py)
      result: >-
        LFM3 1.7B untuned does not meet it (0.528 against 0.842; coverage 0.09 against 0.67). Inkling 2 Mini untuned
        does (0.810 against 0.843 on its 779-case sample, 3.3 points below; coverage 0.51 against 0.64).
      evidence:
        - claims/arxiv-2610.00346/gates-likelihood-readout-27-31b-matches-jev.yaml
        - claims/arxiv-2610.00346/gates-order-effects-untrained.yaml
        - claims/arxiv-2610.03935/jeval-first-token-readout.yaml
        - claims/e04a/e04a-inkling-pooled-accuracy.yaml
        - claims/e04a/e04a-lfm3-pooled-accuracy.yaml
        - claims/e04a/e04a-lfm3-coverage.yaml
        - claims/e04a/e04a-lfm3-order-flip.yaml
        - claims/e04a/e04a-lfm3-slices.yaml
        - claims/e04a/e04a-lfm3-speed.yaml
        - claims/probe/probe-lfm3-first-token.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: temperature-scaling
  description: One temperature per task, fitted on held-out data, applied to a readout's option probabilities.
spec:
  type: method
  lifecycle: candidate
  owner: group:default/metasoar
  morphogen:
    fills: component:default/readout-calibration
    evaluation:
      need: Calibration error at Jev's level on the same cases.
      method: E-04a's `scaled` system (one temperature per slice, fitted on the `fit` half of families)
      result: LFM3 1.7B pooled calibration error 0.026 against Jev's 0.024.
      evidence:
        - claims/arxiv-2610.00346/gates-temperature-fixes-calibration.yaml
        - claims/arxiv-2610.00346/gates-temperature-option-count.yaml
        - claims/e04a/e04a-lfm3-calibration.yaml
