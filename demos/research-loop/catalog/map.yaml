# Our side: the roles the session's papers bear on, and the conditions a claim is compared with. Evidence lines cite
# MetaSoar at a commit (repository@commit:path); demos/research-loop/check.py --metasoar checks each quote.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: decision-backend
  description: >-
    The role: answer a typed question (a choice among options, or yes or no) with a probability for each option, for
    MetaSoar's typed-question interface (M-22). Not filled yet: the backend is to be chosen per task after E-04.
  annotations:
    morphogen.dev/evidence: |
      stated | OpenReplicant/MetaSoar@92105f815c6c2691288c162a40f376be4dd564bb:docs/decision-backends.md | "The typed-question interface (M-22) is well supported. The backend is not decided by the evidence,"
spec: {type: role, lifecycle: experimental, owner: group:default/metasoar, system: metasoar}
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: readout-calibration
  description: >-
    The role: turn a decision backend's raw scores into probabilities and thresholds fit to act on (debiasing over
    option orders, a temperature per task, a threshold at a chosen risk).
  annotations:
    morphogen.dev/evidence: |
      stated | OpenReplicant/MetaSoar@92105f815c6c2691288c162a40f376be4dd564bb:docs/decision-backends.md | "What the papers do say holds at any size: an untuned readout needs work before its probabilities can be trusted."
spec: {type: role, lifecycle: experimental, owner: group:default/metasoar, system: metasoar, subcomponentOf: decision-backend}
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: think-router
  description: >-
    The role: decide, per question, whether the slow model thinks before it answers (E-04's observers). Not filled
    yet.
  annotations:
    morphogen.dev/evidence: |
      stated | OpenReplicant/MetaSoar@92105f815c6c2691288c162a40f376be4dd564bb:docs/decision-backends.md | "E-04 with the observers reordered by evidence:"
spec: {type: role, lifecycle: experimental, owner: group:default/metasoar, system: metasoar}
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: intent-handler
  description: >-
    The role: answer a recurring intent without the large model (a plan template the small model follows, or a
    written handler), falling back to the large model when it does not hold. MetaSoar's handler ladder (M-26).
  annotations:
    morphogen.dev/evidence: |
      stated | OpenReplicant/MetaSoar@22feddc6fa29682e94c2f62fe25da93b559980ab:docs/experiments.md | "**The handler ladder (M-26) cuts model calls on a stream of recurring intents with no loss of accuracy.**"
spec: {type: role, lifecycle: experimental, owner: group:default/metasoar, system: metasoar}
---
