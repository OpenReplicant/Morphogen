schema_version: "1.1"
name: 06-strategy-after-stall
description: After hill-climb has gone four trials without a pass, the agent reports archive-search and the reason.
tags: [evolve, strategy]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Which improvement strategy should Morphogen use next on targets/slow-script, and why? Don't change any code.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep, mcp__plugin_morphogen_morphogen]
runs: 3
graders:
  - name: names-archive-search
    type: regex
    pattern: "archive[- ]search"
    flags: i
  - name: reason
    type: llm
    criteria: |
      The final message says the next strategy is archive-search because hill-climb has gone four trials
      without a pass (it may cite the evidence or payoff), and briefly says what archive-search does differently
      (builds on promising or under-explored variants, not only the trunk). It makes no code changes.
