schema_version: "1.1"
name: 02-map-baseline
description: Map identifies the bottleneck in slow-script and records a measured baseline.
tags: [map]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Map targets/slow-script for Morphogen and record its baseline. What limits it?
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Agent, "Bash(git:*)", "Bash(python:*)", "Bash(python3:*)", mcp__plugin_morphogen_morphogen]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: baseline-measured
    type: tool_used
    tool: mcp__plugin_morphogen_morphogen__measure
  - name: bottleneck-and-number
    type: llm
    criteria: |
      The final message (1) identifies the bottleneck in topwords.py as repeated scanning of the word list
      (the membership check on a list and/or words.count inside the loop, i.e. quadratic work), and (2) reports a
      measured baseline with a number for wall_seconds (or seconds). It does not claim to have changed the code.
  - name: slot-recorded
    type: regex
    target: trace
    pattern: "lists_put"
