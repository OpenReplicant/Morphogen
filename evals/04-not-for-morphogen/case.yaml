schema_version: "1.1"
name: 04-not-for-morphogen
description: An unrelated question does not trigger Morphogen or its judge.
tags: [negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: What is the capital of France? Answer in one word.
  max_turns: 5
  timeout_seconds: 120
  allowed_tools: [Skill, Read, mcp__plugin_morphogen_morphogen]
runs: 3
graders:
  - name: answer
    type: regex
    pattern: "Paris"
  - name: no-skill
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
  - name: no-judge
    type: tool_used
    tool: mcp__plugin_morphogen_morphogen__judge
    min: 0
    max: 0
    arm: both
