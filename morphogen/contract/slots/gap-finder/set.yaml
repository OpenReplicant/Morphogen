# The gap-finder slot's contract (R5-29): what any provider must ask about a system map. New in rebuild 5
# (rebuild 4's map-gaps asked about organisation and process maps). The slot's own runner (runner.py) builds each
# case's claims, runs the provider's <package>.gaps.gaps(claims) in a child process and judges what it answers.
#
# input.services: {<system>/<service>: {image: bool, settings: {name: value}, connects: [<system>/<service>],
#                  limit: bool (a documented limit: bbo:maxValue qualified by the observed property only),
#                  prediction: bool (a plan's prediction: the same, with one more qualifier)}}
#   every service is a kkt:NodeTemplate, kkt:memberOf urn:kk:system:<system>; a connection to a name not listed is
#   to something not on the map
# expect.gaps:      [{kind, target: <system>/<service>}], in any order
# then (optional):  {services: {...}} merged into the input (a person's answers), and expect: every gap after it
slot: gap-finder
runner: runner.py
version: 0.1.0
rules: >-
  For a system map: a connection to something not on the map is a gap (unknown-peer, on the peer); a service with
  no image setting is a gap (no-image); in a system of two or more services, a service nothing connects to and
  that connects to nothing is a gap (unconnected); a service no other service connects to (an entry point) with
  no documented limit is a gap (no-limit), and a plan's prediction is not a documented limit. Each gap derives
  from claims in its input.
