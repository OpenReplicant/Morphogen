# The analyser slot's contract (R5-21): what any anomaly detector must do with observations and
# documented limits. From rebuild 4 modules/anomaly/tests/test_detect.py, as data, plus the edges its
# rules imply. The slot's own runner (runner.py) runs every case against a provider's
# <package>.detect.anomalies(observations, limits) and prints "ok: <id>"; a provider's own runner is not used.
# The sandbox also runs every case through the provider's service (service.py: all cases in one database,
# one pass of <package>.__main__.one_pass(conn), the anomalies it submits judged), R5-23.
#
# input.observations: {id, target, property, window (index; each window is one minute), value, extra?}
#   extra: further qualifiers (an observation qualified by more than its property is not compared)
# input.limits:       {id, target, property, value}
# expect.anomalies:   {kind (limit | zscore), target, observation, limit (for kind limit)}, in any order
# then (optional):    a second stage: {retract: [observation id], limits: [{id, target, property, value,
#   supersedes: <limit id>}], expect: {anomalies}}; expect is every anomaly of the input after the stage.
#   As a service case it is a second pass of the same process, after the retraction and the new limit
#   are recorded; what that pass submits must be the anomalies not already submitted by the first (a limit
#   anomaly against another limit is another anomaly).
slot: analyser
runner: runner.py
version: 0.2.0
rules: >-
  Per target and property, each of the latest 3 windows is anomalous when its value exceeds the documented
  limit (kind limit, derived from the observation and the limit), or lies more than 3 standard deviations
  from the mean of the previous windows when there are at least 5 of them, up to 20 (kind zscore, derived
  from the observation and the windows compared); when those windows have no spread, more than 3 tenths of
  their mean away, or more than 3 away when the mean is 0. A limit applies to its own property only.
