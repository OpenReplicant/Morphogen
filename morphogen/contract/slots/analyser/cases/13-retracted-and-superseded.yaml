id: urn:kk:eval:analyser/retracted-and-superseded
text: 'a second pass after the newest observation is retracted and the limit is superseded
  by a higher one: the spike is among the latest windows again and unusual, but under
  the limit now in force; a provider that keeps what it read, or reads retracted observations,
  misses the z-score, and one that reads the superseded limit flags a limit anomaly
  it should not'
input:
  observations:
  - id: o0
    target: urn:kk:node:shop
    property: urn:kk:property:latency-seconds-mean
    window: 0
    value: 0.012
  - id: o1
    target: urn:kk:node:shop
    property: urn:kk:property:latency-seconds-mean
    window: 1
    value: 0.013
  - id: o2
    target: urn:kk:node:shop
    property: urn:kk:property:latency-seconds-mean
    window: 2
    value: 0.014
  - id: o3
    target: urn:kk:node:shop
    property: urn:kk:property:latency-seconds-mean
    window: 3
    value: 0.012
  - id: o4
    target: urn:kk:node:shop
    property: urn:kk:property:latency-seconds-mean
    window: 4
    value: 0.013
  - id: o5
    target: urn:kk:node:shop
    property: urn:kk:property:latency-seconds-mean
    window: 5
    value: 0.014
  - id: o6
    target: urn:kk:node:shop
    property: urn:kk:property:latency-seconds-mean
    window: 6
    value: 0.05
  - id: o7
    target: urn:kk:node:shop
    property: urn:kk:property:latency-seconds-mean
    window: 7
    value: 0.012
  - id: o8
    target: urn:kk:node:shop
    property: urn:kk:property:latency-seconds-mean
    window: 8
    value: 0.013
  - id: o9
    target: urn:kk:node:shop
    property: urn:kk:property:latency-seconds-mean
    window: 9
    value: 0.014
  limits:
  - id: L0
    target: urn:kk:node:shop
    property: urn:kk:property:latency-seconds-mean
    value: 0.04
expect:
  anomalies: []
then:
  retract:
  - o9
  limits:
  - id: L1
    target: urn:kk:node:shop
    property: urn:kk:property:latency-seconds-mean
    value: 0.1
    supersedes: L0
  expect:
    anomalies:
    - kind: zscore
      target: urn:kk:node:shop
      observation: o6
