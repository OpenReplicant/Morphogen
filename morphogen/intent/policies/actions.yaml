# The fixed action list (D-53, R5-20, R5-21): what a plan may ask for. Anything else is not an action; the
# planner says so to a person instead. Read-only to agents.
#   kind setting  a plan step the intent actuator carries out by changing one setting in intent
#   kind request  not a plan: a build request (auto lane) that changes nothing running; the builder answers it
#   kind replace  a plan step the intent actuator carries out by running a measured candidate instead
#   kind create   a plan step the intent actuator carries out by writing a new system's compose file from the
#                 system a person described (morphogen.blueprint); the step names the file's sha256 (R5-29)
#   kind adopt    a plan step that names an existing system's compose file by its sha256: a person approves the
#                 file as committed; the actuator writes nothing (T26)
# A runtime runs only a file a person approved as shown (T26, morphogen.plans.approval): a create or adopt step whose
# label shows the file, or a node's setting step from this list, whose file the runtime derives itself. A node step
# also names the yielded file's sha256 for the actuator, which writes only that file.
# applies_to: provider (default; its intent file in environments/), node (a service of a managed system,
# intent/systems/<system>/compose.yaml, R5-25) or system (urn:kk:system:<system>, a new one).
# effect: halve (default) or proportional (planner/plan.py).
actions:
  urn:kk:action:set-poll-seconds:
    kind: setting
    label: set how often a change feed consumer reads the feed
    setting: KK_POLL_SECONDS          # an environment variable of the provider's service (kk.lib follow)
    min: 0.1
    max: 30
    risk: low                         # reversible by the same action; no data changes
    answers: [urn:kk:property:feed-lag-seconds-mean]
  urn:kk:action:set-random-delay-max:
    kind: setting
    applies_to: node
    label: set the most a podinfo service waits before answering (its documented random delay)
    setting: PODINFO_RANDOM_DELAY_MAX # in the unit PODINFO_RANDOM_DELAY_UNIT gives (podinfo --random-delay-max)
    min: 0
    max: 5000
    integer: true
    effect: proportional              # a delay drawn from [min, max] has mean (min + max) / 2: request time scales with it
    risk: low                         # reversible by the same action; no data changes
    answers: [urn:kk:property:latency-seconds-mean]
  urn:kk:action:build-candidate:
    kind: request
    label: build a candidate provider for the slot and measure it against the incumbent in the sandbox
    risk: low                         # sandbox only: nothing running changes
    answers: [urn:kk:property:step-seconds-mean]
  urn:kk:action:replace-provider:
    kind: replace
    label: run a candidate that passed the slot's contract and measured better than the incumbent instead of it
    risk: medium                      # new code; reversible by the same action
    answers: []                       # proposed from measurements, not from an anomaly directly
  urn:kk:action:create-system:
    kind: create
    applies_to: system
    label: write a new system's compose file from the system a person described
    risk: medium                      # new running code: the runtime runs the file once this step is approved (T26)
    answers: []                       # proposed from a description with no gaps, not from an anomaly
  urn:kk:action:adopt-system:
    kind: adopt
    applies_to: system
    label: run a system's compose file as committed (a file a person brought in, not one Morphogen wrote)
    risk: medium                      # new running code; a runtime runs only a file an approved step names (T26)
    answers: []                       # proposed by encoder-compose when it maps a file no approved step names
