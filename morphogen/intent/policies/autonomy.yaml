# Autonomy level x risk class -> decision (decision 0009; R5-08).
# The irreversible column is fixed: always a person.
# report and approve go to the review lane; auto and auto_notify may apply without it. The store also
# forces review for plan steps (sosa:Actuation, setting review_types) until a provider earns a level
# above L1 (R5-20), so today every plan waits for a person.
levels:
  default: L1                     # every module that plans starts here
matrix:
  L0: { low: report,        medium: report,        high: report,        irreversible: approve }
  L1: { low: approve,       medium: approve,       high: approve,       irreversible: approve }
  L2: { low: auto_notify,   medium: approve,       high: approve,       irreversible: approve }
  L3: { low: auto,          medium: auto_notify,   high: approve,       irreversible: approve }
  L4: { low: auto,          medium: auto,          high: auto_notify,   irreversible: approve }

promotion:
  verified_changes_required: 20   # at current level, zero rollbacks
demotion:
  on: [verification_failed, rollback]
  levels: 1

guards:
  kill_switch_file: policies/KILL     # presence stops all promotion
  max_changes_per_hour_per_target: 3
  cooldown_per_slot: PT15M
  blast_radius_budget_slots: 5     # nodes a step reaches: its node and all that depend on it (kk.graph, R5-32)
  proposal_default_ttl: PT24H
  recheck_preconditions_before_commit: true
