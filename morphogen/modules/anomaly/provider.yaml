id: urn:kk:provider:anomaly
name: Anomaly detection
version: 0.2.0
license: Apache-2.0
slots: [analyser]
origin: OpenReplicant/kernel (rebuild 4) modules/anomaly; detect.py unchanged, the service follows the change feed
requires: Python 3.12+, psycopg
migration: migration.sql
service: python3 -m anomaly
role: kkm_anomaly
login: kkm_anomaly_login
agent: urn:kk:agent:anomaly
tests: [python3 tests/test_detect.py]
note: over a documented limit (bbo:maxValue), or more than 3 standard deviations from recent windows; an oa:Annotation on the feature of interest, inferred from what it compared
