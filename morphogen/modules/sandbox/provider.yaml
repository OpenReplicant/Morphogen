id: urn:kk:provider:sandbox
name: 'Sandbox: candidates measured on a copy of the record'
version: 0.1.0
license: Apache-2.0
slots: [sandbox]
emits: []
consumes: [dcterms:source, {term: sosa:hasSimpleResult, optional: true, from: observers}]
origin: new (T6, R5-21)
requires: Python 3.12+, psycopg, PyYAML; a superuser login for the sandbox cluster (it creates and drops databases)
migration: migration.sql
command: python3 -m sandbox <intent/experiments/<id>>
service: python3 -m sandbox
tests: [python3 tests/test_sandbox.py]
note: writes no claims; the evaluator records the scores of candidate and incumbent, each linked to its provider
