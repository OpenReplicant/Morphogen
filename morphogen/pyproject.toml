[project]
name = "morphogen"
version = "0.1.0"
description = "Describe a system; Morphogen builds and manages it, starting with itself."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["kk"]

[tool.uv.sources]
kk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morphogen"]
