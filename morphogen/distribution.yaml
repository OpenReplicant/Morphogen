# Morphogen: a system you describe, which builds and manages it, starting with itself.
# A distribution = kernel slots it uses + application slots it declares + the providers that fill them.
# Application slots live here until a second distribution needs one; then the slot and its default
# provider move under kernel/.
id: morphogen
version: 0.1.0
kernel: ">=0.1.0"

uses_kernel_slots:
  - record-store
  - write-pipeline
  - intake-filter
  - validator
  - lane-policy
  - change-feed
  - belief-model
  - verifier
  - recall
  - agent-interface
  - vocabulary-pack
  - self-encoder
  - evaluator
  - harness-adapter

# The MAPE-K loop and design path. status: to-port (from rebuild 4) | to-rewrite | new | ported | written
# Providers live in modules/<name>/ (provider.yaml); morphogen/tests/test_loop.py runs the loop (T5).
# contract: a case set every provider of the slot must pass (contract/slots/<slot>), or provider-tests
# (a declared gap); paths relative to this file (R5-21). morphogen/contract/run.sh checks it.
slots:
  - id: design-agent
    phase: design
    default: interview-encoder + map-gaps      # rebuild 4: encoder-interaction, skill-interview, map-gaps
    contract: provider-tests
    status: to-port
  - id: system-encoder
    phase: design
    cardinality: many
    default: encoder-compose                   # a compose file as a TOSCA topology, every claim citing its line (R5-25)
    contract: provider-tests
    status: written
  - id: observer
    phase: monitor
    cardinality: many
    default: observer-otel                     # OTLP/HTTP receiver -> SOSA observations; observer-prometheus to port
    contract: provider-tests
    status: written
  - id: analyser
    phase: analyse
    cardinality: many
    default: anomaly                           # rebuild 4: modules/anomaly (detect.py unchanged)
    contract: contract/slots/analyser
    status: ported
  - id: planner
    phase: plan
    default: planner                           # fixed action list; plans carry a prediction and a risk class
    contract: provider-tests
    status: written                            # a model-driven planner is a candidate provider (rebuild 4 skill)
  - id: actuator
    phase: execute
    cardinality: many
    default: intent-actuator                   # approved plan steps become commits; deploy/reconcile.py runs them
    contract: provider-tests
    status: written
  - id: outcome-verifier
    phase: verify
    default: prediction-verifier               # compares observations with plan predictions; not the planner
    contract: provider-tests
    status: written
  - id: builder
    phase: plan
    default: builder                           # a build request becomes a candidate provider in intent/experiments/
    contract: provider-tests
    status: written
  - id: sandbox
    phase: plan
    default: sandbox                           # a candidate and the incumbent: the slot's contract, then measured on a copy of the record
    contract: provider-tests
    status: written
  - id: catalog-lookup
    phase: plan
    cardinality: many
    default: registry-lookup                   # configured registries, matched on slot requirements
    contract: provider-tests
    status: new

lane_policy:
  file: intent/policies/autonomy.yaml          # autonomy level x risk class
  provider: lane-autonomy                      # fills the kernel's lane-policy slot for Morphogen (R5-20)
actions: intent/policies/actions.yaml          # the fixed action list plans choose from

packs:
  - prov
  - sosa
  - dqv
  - kk-tosca                                   # system structure: slots, couplings (TOSCA mirror)
  - org

gates:
  G2: Morphogen changes one of its own providers through the loop and the observed result matches the prediction.
  G3: Morphogen maps a small system it did not build and completes one governed change on it.
