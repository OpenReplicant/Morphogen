[project]
name = "morphogen"
version = "0.2.0"
description = "Minimum viable Morphogen: lists, evidence and an outside judge, served over MCP."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "pyyaml==6.0.3",
  # Document schemas (documents.py). Already required by mcp (>=2.12); pinned to a release
  # out since May 2026 rather than the days-old 2.14.2 the lock had picked.
  "pydantic==2.13.4",
  # The store (store.py): SQLite by default, Postgres by URL. MIT; needs only typing-extensions.
  # 2.0.51 (June 2026): the 2.1 series is only weeks old.
  "SQLAlchemy==2.0.51",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[project.scripts]
morphogen-mcp = "morphogen.mcp_server:main"
morphogen-admin = "morphogen.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# greenlet comes with SQLAlchemy and is used only by its asyncio support, which Morphogen does not
# use; keep it on a release that has been out for a while (June 2026; checked 2026-11-03).
constraint-dependencies = ["greenlet==3.5.2"]

[tool.hatch.build.targets.wheel]
packages = ["morphogen"]
