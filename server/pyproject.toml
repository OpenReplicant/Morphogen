[project]
name = "morphogen"
version = "0.2.0"
description = "Minimum viable Morphogen: lists, evidence and an outside judge, served over MCP."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "pyyaml==6.0.3",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[project.scripts]
morphogen-mcp = "morphogen.mcp_server:main"
morphogen-admin = "morphogen.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["morphogen"]
