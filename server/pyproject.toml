[project]
name = "morphogen"
version = "0.2.0"
description = "Minimum viable Morphogen: lists, evidence and an outside judge, served over MCP."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "pyyaml==6.0.3",
  # Document schemas (documents.py). Already required by mcp (>=2.12); pinned to a release
  # out since May 2026 rather than the days-old 2.14.2 the lock had picked.
  "pydantic==2.13.4",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[project.optional-dependencies]
# The postgres backend (backends.default: postgres). pg8000: pure Python, BSD-3-Clause.
postgres = ["pg8000==1.31.5"]

[project.scripts]
morphogen-mcp = "morphogen.mcp_server:main"
morphogen-admin = "morphogen.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Keep pg8000's dependencies on releases that have been out for a while (checked 2026-11-03):
# python-dateutil 4.0.0 and scramp 1.5.0 were days old.
constraint-dependencies = ["python-dateutil==2.9.0.post0", "scramp==1.4.9"]

[tool.hatch.build.targets.wheel]
packages = ["morphogen"]
