[project]
name = "morphogen"
version = "0.0.1"
description = "Map any system as slots and couplings and adapt it through a MAPE-K loop."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "OpenReplicant" }]
dependencies = [
  "cognee[postgres]",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "cloudevents>=1.11",
  "mcp>=1.2",
  "pydantic>=2.8",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morphogen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
