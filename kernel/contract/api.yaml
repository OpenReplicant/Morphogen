# The kernel's wire API, versioned (T25, R5-42 (b)): what a provider, a distribution or an agent built against the
# record store may rely on. kernel/contract/api.yaml lists it, read from a fresh record (record-postgres's schema, no
# provider installed):
#
#   functions  every function in schema api, and every non-trigger function in schema kernel that kk_agent may execute,
#              with its arguments and result
#   relations  every view in schema api, and every table or view in schema kernel that kk_agent may read, with its columns
#   version    semantic: a change that removes or changes anything listed is a major version, an addition a minor one;
#              api.version() returns it, so a client can check what it talks to
#   change_set the change-set schema's $id (kernel/schemas/change_set.schema.json); the MCP tools agents rely on are the
#              agent-interface slot's (contract/slots/agent-interface/set.yaml `tools`)
#
version: 1.0.0
functions:
  api.claims_as_of(valid_at timestamp with time zone, known_at timestamp with time zone): SETOF api.claims
  api.explain(claim_id uuid): jsonb
  api.feed(after_seq bigint, max_rows integer): TABLE(seq bigint, kind text, change_set_id uuid, scope text, applied_at timestamp with time zone, claim_ids uuid[], predicates text[], target_kind text, target_id
    text)
  api.finish_run(run_id uuid, status text, cost jsonb, outputs jsonb, feed_seq bigint): void
  api.record_validation(change_set_id uuid, ok boolean, report jsonb): text
  api.redact(target_kind text, target_id text, reason text, run uuid): uuid
  api.review(change_set_id uuid, approve boolean, note text): text
  api.start_run(module text, plan_step text, used jsonb, info jsonb): uuid
  api.submit_change_set(cs jsonb): jsonb
  api.version(): text
  kernel.can_read(p_scope text): boolean
  kernel.claim_visible(p_claim uuid): boolean
  kernel.current_status(p_claim uuid): text
  kernel.expand(term text): text
  kernel.is_approved_property(p_iri text): boolean
  kernel.my_agent(): text
  kernel.needs_review(p_ops jsonb): boolean
  kernel.readers_subset(p_target text, p_input text): boolean
  kernel.role_can_write(p_role name, p_scope text): boolean
  kernel.statement_key(p_subject text, p_predicate text, p_object_entity text, p_object_value jsonb, p_qualifiers jsonb): text
