# Slot contract, ported from rebuild 4 eval/belief-v0. Every provider of the slot must pass every case
# (kernel/contract/run.py; first passed by kernel/providers/belief-corroboration).
id: urn:kk:eval:belief-v0
slot: belief-model
gate: G1
metrics:
  - {name: accuracy, description: share of cases where every expected belief matches (to 4 decimals)}
pass: {accuracy: 1.0}
# Case format: claims (id, statement key, subject, predicate, object, agent, sources, optional
# valid_from / valid_to / deprecated), functional (single-valued predicates), expect {claim id: belief}.
# Formula: S / (S + C + 1), S = independent supporting groups, C = independent conflicting groups.
