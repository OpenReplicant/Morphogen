# The gap-finder slot's contract (R5-29; a kernel slot since R5-47): what a gap finder, with the kernel's packs
# installed, must ask about a system map. The questions are the kk-tosca pack's warning shapes (kernel/packs/
# kk-tosca.shapes.ttl) for the kernel's provider, gaps-shacl. Morphogen's map-gaps, the first provider (the same
# rules in Python), was retired when drift was added (R5-49). New in rebuild 5 (rebuild 4's map-gaps asked about organisation and process maps). The
# slot's own runner (runner.py) builds each case's claims, runs the provider's <package>.gaps.gaps(claims) in a
# child process (with the kernel's kk on its path) and judges what it answers.
#
# input.services: {<system>/<service>: {image: true (pinned by digest) or the image as written, settings: {name: value}, connects: [<system>/<service>],
#                  limit: bool (a documented limit: bbo:maxValue qualified by the observed property only),
#                  prediction: bool (a plan's prediction: the same, with one more qualifier)}}
#   every service is a kkt:NodeTemplate, kkt:memberOf urn:kk:system:<system>; a connection to a name not listed is
#   to something not on the map
# input.running:   {<system>/<service>: {of: <system>/<service> (the template it runs; none: nothing intends it),
#                  image: true (the template's pinned image) or as written, settings: {name: value}}}: what a runtime's
#                  encoder observed, each a kkt:NodeRepresentation (R5-49)
# expect.gaps:      [{kind, target: <system>/<service>, <system> for a gap on the system, or running:<system>/<service>}], in any order
# then (optional):  {services: {...}, running: {...}} merged into the input (a person's answers, a change to what runs),
#                  and expect: every gap after it
slot: gap-finder
runner: runner.py
version: 0.6.0
rules: >-
  For a system map: a connection to something not on the map is a gap (unknown-peer, on the peer); a service with
  no image setting is a gap (no-image); a service whose images are none pinned by digest (name@sha256:<64 hex>) is
  a gap (unpinned-image); in a system of two or more services, a service nothing of its own system connects to
  and that connects to nothing is a gap (unconnected); a service no other service of its system connects to (an entry
  point) with no documented limit is a gap (no-limit), and a plan's prediction is not a documented limit; a system
  each of whose services is called by another of its services, none with a limit, is a gap on the system (no-limit).
  Where something of a system runs (a node representation): a template setting the running node lacks or has
  with another value is drift-modified (on the running node); a template of that system with nothing running for
  it is drift-obsolete; a running node no template describes is drift-novel (R5-49). A system nothing of runs has
  no drift.
  Each gap derives from claims about its own target (the service's, the connections to an unknown peer, the
  system's services').
