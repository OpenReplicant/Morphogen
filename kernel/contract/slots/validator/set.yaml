# Slot contract, ported from rebuild 4 eval/validator. Every provider of the slot must pass every case
# (kernel/contract/run.py; first passed by kernel/providers/validator-shacl).
id: urn:kk:eval:validator
slot: validator
gate: G1
metrics:
  - {name: accuracy, description: share of cases with the expected outcome and reason}
pass: {accuracy: 1.0}
# reason forms: a shape's sh:message; "shape: <path IRI>" for a violation on that path;
# "schema: <JSON path prefix>" for a JSON Schema error at or below that path.
