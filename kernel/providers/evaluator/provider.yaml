id: urn:kk:provider:evaluator
name: Evaluator
version: 0.1.0
license: Apache-2.0
slots: [evaluator]
emits: [rdfs:label, dcterms:subject, dqv:value, dqv:isMeasurementOf, dqv:computedOn]
consumes: []
origin: OpenReplicant/kernel (rebuild 4) modules/evaluator, unchanged
requires: Python 3.12+, psycopg; the dqv pack (dqv:value must be an approved property)
migration: migration.sql
command: python3 -m evaluator --suite <name> [--artifacts <dir>] <run.json>...
role: kkm_evaluator
tests:
  - python3 tests/test_measure.py
todo:
  - score a candidate provider against the incumbent on the same set and record the comparison (G2); today it
    records each run's scores as DQV measurements, and the comparison is a query over them
