id: urn:kk:provider:filter-gitleaks
name: 'Intake filter: secrets (gitleaks)'
version: 0.3.0
license: MIT
slots: [intake-filter]
origin: OpenReplicant/kernel (rebuild 4) modules/ingest-filter-gitleaks (MIT there); the file command unchanged, `filter(change_set)` added (R5-29)
requires: Python 3.12+; gitleaks 8.30.1 on PATH (github.com/gitleaks/gitleaks releases, linux_x64 sha256 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb)
command: python3 -m filter_gitleaks --repo <dir> <paths...>   |   filter_gitleaks.filter(change_set)
note: never writes to the record, so it has no role or migration; findings are reported, never stored
tests:
  - python3 tests/test_filter.py
