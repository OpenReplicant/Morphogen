# The kernel's self-blueprint: its own slots, couplings and default providers.
# Encoded into the record as claims by the self-encoder, so the kernel can reason about itself and
# changes to it go through the same governed path as anything else.
#
# Only kernel slots live here. Application slots (observe, plan, act, design, ...) are declared by
# distributions (morphogen/distribution.yaml). Rebuild 4's 42-slot catalog is kept for reference in
# docs/slots-rebuild4.yaml.
#
# core: true  = swappable only by a provider that passes kernel/contract/
# hook        = where in the write pipeline or read path the slot attaches
# cardinality = one (one active provider; alternatives run in shadow until the evaluator promotes one) | many
# interface   = kernel/src/kk/interfaces.py
# contract    = what every provider must pass (R5-21): a case set (invariants.yaml, contract/slots/<slot>), or
#               none (an unfilled slot). Paths are relative to this file. kernel/contract/run.py checks it, and with
#               cases_required (T25, R5-42 (b)) refuses provider-tests (only one provider's own tests) for a slot
#               here: a replacement must have shared cases to pass. A distribution's blueprint may still declare it.
# default     = the provider installed by default; none = declared but unfilled (`why` says what the slot is
#               for and when a distribution would fill it). Nothing depends on an unfilled slot.
version: 0.2.0
cases_required: true

slots:
  # ---- core
  - id: record-store
    core: true
    cardinality: one
    interface: RecordStore
    default: record-postgres
    contract: ../contract/invariants.yaml
    status: ported
  - id: write-pipeline
    core: true
    cardinality: one
    interface: WritePipeline
    default: record-postgres          # change sets, lanes and atomic apply live in the same schema today
    contract: ../contract/invariants.yaml
    status: ported

  # ---- before the commit
  - id: intake-filter
    hook: intake
    cardinality: many
    interface: IntakeFilter
    default: filter-gitleaks          # rebuild 4: modules/ingest-filter-gitleaks; files (kk.lib.ingest_filter), and proposals when a caller runs filter() (R5-29)
    contract: ../contract/slots/intake-filter
    status: ported
  - id: validator
    hook: validation
    cardinality: many
    interface: Validator
    default: validator-shacl          # contract slots/validator; a JSON Schema provider is a candidate (R5-15)
    contract: ../contract/slots/validator
    status: ported
  - id: lane-policy
    hook: lane
    cardinality: one
    interface: LanePolicy
    default: record-postgres          # its review rules (settings review_predicates / review_types, rebuild 4 review-rules)
    contract: ../contract/slots/lane-policy
    status: ported-in-schema

  # ---- after the commit
  - id: change-feed
    hook: feed
    cardinality: one
    interface: RecordStore.feed
    default: record-postgres          # kernel.feed + api.feed(after_seq, max_rows); contract section feed
    contract: ../contract/invariants.yaml
    status: written
  - id: belief-model
    hook: feed
    cardinality: one
    interface: BeliefModel
    default: belief-corroboration     # contract slots/belief-model; a feed consumer (kk.lib.follow)
    contract: ../contract/slots/belief-model
    status: ported
  - id: verifier
    hook: feed
    cardinality: many
    interface: Verifier
    default: verifier-quotes          # a feed consumer; its method's own cases stay in its tests (tests/test_check.py)
    contract: ../contract/slots/verifier
    status: ported
  - id: truth-maintenance
    hook: feed
    cardinality: one
    interface: FeedConsumer
    default: truth-maintenance        # rebuild 4 modules/truth-maintenance (D-89), plan.py unchanged, follows the feed
    contract: ../contract/slots/truth-maintenance
    status: ported
    why: >-
      Marks claims derived from a premise that was later superseded, refuted, retracted or redacted (directly or
      through other derived claims) inconclusive, naming the withdrawn premises, so the belief model caps them;
      supported again when the premises are current. Filled in T18 (R5-O7 a1): distributions now keep inferred
      claims whose premises change (Morphogen's catalog offers, inferred from build requests; answered gaps).

  # ---- read path
  - id: recall
    hook: read
    cardinality: many
    interface: Recall
    default: recall-bm25              # SciFact nDCG@10 0.6606 (rebuild 4 floor 0.6594); dense and re-ranking opt-in, not ported
    contract: ../contract/slots/recall
    status: ported
  - id: agent-interface
    hook: read
    cardinality: many
    interface: MCP tools (read + propose)
    default: kernel-mcp               # operator tools; the memory profile is not ported (R5-12)
    contract: ../contract/slots/agent-interface
    status: ported
  - id: context-assembler
    hook: read
    cardinality: one
    interface: ContextAssembler
    default: none
    contract: none
    status: unfilled
    why: >-
      Builds a session briefing for an agent from the record (rebuild 4 kernel-mcp briefing, M6-T7, for the
      agent-memory use). Morphogen's agents work from explicit queries (slots, couplings, drift, plans) through
      the agent interface and recall, so no Morphogen use case needs a briefing. Fill it when a distribution
      serves agent memory.

  # ---- maintenance
  - id: vocabulary-pack
    cardinality: many
    interface: pack (kernel/packs/packs.yaml)
    default: pack-loader              # packs.sql generated from kernel/packs, reviewed as code
    contract: ../contract/slots/vocabulary-pack
    status: ported
  - id: self-encoder
    cardinality: one
    interface: Encoder
    default: self-encoder             # encodes this file, provider manifests and a distribution file as claims
    contract: ../contract/slots/self-encoder
    status: written
  - id: evaluator
    cardinality: one
    interface: Evaluator
    default: evaluator                # records eval runs as DQV measurements; candidate vs incumbent in G2
    contract: ../contract/slots/evaluator
    status: ported
  - id: harness-adapter
    cardinality: many
    interface: HarnessAdapter
    default: none
    contract: none
    status: unfilled
    why: >-
      Maps the kernel's hook events onto an agent harness (rebuild 4's Claude Code hooks: recall cues, attributing
      tool calls). A distribution can run its harness with the kernel MCP server as its only way to the record and
      need no hooks (Morphogen runs Claude Code so, T23, T24). Fill it when a harness needs the kernel's hooks, or when
      a UI needs a harness's events (the interview in the UI, R5-O14).

couplings:
  # who feeds whom; every coupling's contract is the change-set schema or an interface above
  - {from: intake-filter, to: validator, contract: change_set.schema.json}
  - {from: validator, to: lane-policy, contract: ValidationResult}
  - {from: lane-policy, to: write-pipeline, contract: Lane}
  - {from: write-pipeline, to: record-store, contract: atomic commit (no extension code)}
  - {from: record-store, to: change-feed, contract: Applied}
  - {from: change-feed, to: [belief-model, verifier, truth-maintenance], contract: Applied}
  - {from: [belief-model, verifier, truth-maintenance], to: intake-filter, contract: change_set.schema.json}
  - {from: record-store, to: [recall, agent-interface, context-assembler], contract: RecordStore, note: reader's clearance}
