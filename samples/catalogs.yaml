# Where to look before building something new. Edit freely.
# Everything found here is untrusted until pinned, licence-checked and judged.

catalogs:
  - name: PyPI
    url: https://pypi.org
    finds: Python packages
  - name: npm
    url: https://www.npmjs.com
    finds: JavaScript and TypeScript packages
  - name: MCP Registry
    url: https://registry.modelcontextprotocol.io
    finds: MCP servers (tools and data sources)
  - name: Agent Skills
    url: https://agentskills.io
    finds: portable SKILL.md skills
  - name: Claude Code plugins
    url: https://code.claude.com/docs
    finds: plugins, skills, hooks, subagents, marketplaces
  - name: Hugging Face Hub
    url: https://huggingface.co
    finds: models and datasets
  - name: Docker Hub
    url: https://hub.docker.com
    finds: container images
  - name: GitHub
    url: https://github.com
    finds: source repositories; check activity, licence and issues before trusting

# Known techniques, so the agent reuses before inventing.
techniques:
  - name: Standard library data structures
    finds: dict, set, collections.Counter, heapq, bisect, functools.lru_cache
    when: counting, membership, top-k, sorted search, memoisation
  - name: Algorithmic complexity first
    finds: replace quadratic scans with hashing or sorting before micro-optimising
  - name: Profiling
    finds: cProfile, timeit, line_profiler (PyPI)
    when: locate the bottleneck before changing code

# Improvement strategies not shipped as cards yet. To adopt one, write a card
# in strategies/ (see the shipped ones) and let the judge's evidence show
# whether it pays.
strategies:
  - name: beam search
    finds: keep the top k passing variants and refine each; gains that stack
  - name: islands and MAP-Elites
    url: https://github.com/codelion/openevolve
    finds: best variant per approach family; diversity when one family keeps winning
  - name: reflective evolution (GEPA)
    url: https://arxiv.org/abs/2507.19457
    finds: propose from the reasons failed verdicts gave; many near misses
  - name: simulated annealing
    finds: accept small regressions on side branches as stepping stones
  - name: multi-armed bandits
    finds: spend trials across strategies or approach families by observed payoff
  - name: Darwin Gödel Machine
    url: https://arxiv.org/abs/2505.22954
    finds: open-ended archive search (shipped as archive-search)

# Where trials run. Shipped: docker, podman, none. The rest are planned runners.
runners:
  - name: Podman
    url: https://podman.io
    finds: rootless, daemonless containers (shipped as sandbox podman)
  - name: Kubernetes Jobs
    url: https://kubernetes.io/docs/concepts/workloads/controllers/job/
    finds: trials on a cluster in a throwaway namespace; pin CPUs or use dedicated nodes for timing
  - name: Nomad batch jobs
    url: https://developer.hashicorp.com/nomad/docs/job-specification
    finds: trials on a Nomad cluster
  - name: gVisor
    url: https://gvisor.dev
    finds: a user-space kernel for stronger container isolation (runsc)
  - name: Firecracker
    url: https://firecracker-microvm.github.io
    finds: microVMs for untrusted trials

# Measuring services and observing Morphogen.
observability:
  - name: OpenTelemetry
    url: https://opentelemetry.io
    finds: traces, metrics and logs; the collector as a source for observers
  - name: Prometheus
    url: https://prometheus.io
    finds: metrics queries for observers
  - name: Jaeger
    url: https://www.jaegertracing.io
    finds: trace viewer for Morphogen's spans
  - name: Arize Phoenix
    url: https://github.com/Arize-ai/phoenix
    finds: LLM call tracing
  - name: Envoy, Linkerd
    finds: proxy-level metrics collected outside the service (collected outside)

# Judges for direct trials in production.
progressive_delivery:
  - name: Argo Rollouts
    url: https://argoproj.github.io/rollouts/
    finds: canary analysis against baseline metrics, automatic rollback
  - name: Flagger
    url: https://flagger.app
    finds: canary and A/B analysis for Kubernetes services

# Side-car tools for the admin-ui slots. Found by search on 2026-11-02; none has
# been read or run yet. Morphogen lists them and never installs them: pin a
# version, check the licence and advisories, and read it before running one.
# To show one in the menu, add a component (status: in use, url: ...) and fill
# its slot. None of them may take approvals.
admin_ui:
  - name: CloudCLI (claudecodeui)
    url: https://github.com/siteboon/claudecodeui
    slot: admin-ui/sessions
    finds: web and mobile UI for Claude Code, Cursor CLI and Codex sessions
    licence: "unclear: GPL-3.0 per GitHub metadata, AGPL-3.0-or-later per other sources"
    interface: separate process, HTTP; controls sessions
    trust: open
    notes: Snyk lists advisories for some versions; forks and mirrors exist, use the original
  - name: TwiCC
    url: https://pypi.org/project/twicc/
    slot: admin-ui/sessions
    finds: one web interface for Claude Code and Codex, several terminals, quota graphs
    licence: unknown
    interface: separate process, HTTP; needs Python 3.13+
    trust: open
  - name: Claude Code Web
    url: https://github.com/fafawlf/claude-code-web
    slot: admin-ui/sessions
    finds: self-hosted web workspace for Claude Code, experimental Codex support
    licence: unknown
    interface: separate process, HTTP over localhost or an SSH tunnel
    trust: unvetted
    notes: early (few users)
  - name: ttyd
    url: https://github.com/tsl0922/ttyd
    slot: admin-ui/terminal
    finds: a terminal shared over the web
    licence: MIT (reported, not confirmed from the project)
    interface: separate process, HTTP and WebSocket
    trust: open
  - name: code-server
    url: https://github.com/coder/code-server
    slot: admin-ui/editor
    finds: VS Code in the browser
    licence: MIT; recent versions reportedly bundle a Copilot component with other terms
    interface: separate process, HTTP
    trust: open
  - name: Puter
    url: https://github.com/heyputer/puter
    slot: admin-ui/shell
    finds: a self-hostable web desktop that could hold the other tools
    licence: AGPL-3.0 (puter.js SDK also Apache-2.0)
    interface: separate process, HTTP; self-hosted build is alpha per its maintainers
    trust: open
