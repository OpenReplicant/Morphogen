# A template for YOUR repository, not an active workflow here: GitHub never runs it from skills/.
# It builds your research site (Morphogen's site/README.md) from the config `morphogen site init` wrote, and deploys
# it to GitHub Pages. To turn it on:
#   1. copy it to .github/workflows/research-site.yml in your repository;
#   2. set SITE_CONFIG below to your config file (the path from the repository root);
#   3. pin MORPHOGEN_REF to a Morphogen commit or tag you have read (the site's code comes from there);
#   4. in Settings > Pages, set the source to "GitHub Actions";
#   5. run it once by hand (Actions > research-site > Run workflow), then uncomment `push` if wanted.
# Links are relative, so the site works at https://OWNER.github.io/REPO/ as it is. SITE_BASE is only for a host that
# needs absolute links under a subpath, e.g. /research.
name: research-site
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_CONFIG: site.toml
  SITE_BASE: ""
  MORPHOGEN_REF: main   # pin a commit SHA

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Morphogen's site sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: OpenReplicant/Morphogen
          ref: ${{ env.MORPHOGEN_REF }}
          path: .morphogen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24.5.0
      - name: Install the site's packages (exact versions from its package-lock.json)
        working-directory: .morphogen/site
        run: npm ci --ignore-scripts --no-fund
      - name: Build (the same as `morphogen site build --config $SITE_CONFIG --out _site --base $SITE_BASE`)
        working-directory: .morphogen/site
        env:
          MORPHOGEN_SITE_CONFIG: ${{ github.workspace }}/${{ env.SITE_CONFIG }}
          MORPHOGEN_SITE_OUT: ${{ github.workspace }}/_site
          MORPHOGEN_SITE_BASE: ${{ env.SITE_BASE }}
        run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
