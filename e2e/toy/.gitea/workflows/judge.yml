# The judge on Gitea. Triggered by pull_request_target, so this definition is always the base's
# (measured: DECISIONS.md row 8). The candidate's code runs only in the `run` job, inside sandbox
# containers; the `admit` and `score` jobs hold the secrets and never run it. The steps are the same
# `judge.ci` commands the GitHub Actions workflow uses.
name: judge
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

env:
  PR: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_REF: ${{ github.event.pull_request.base.ref }}
  CASES_REPO: owner/toy-cases
  SANDBOX_IMAGE: python:3.13-slim
  MODULE: topwords

jobs:
  admit:
    runs-on: trusted
    outputs:
      admitted: ${{ steps.admit.outputs.admitted }}
      base: ${{ steps.fetch.outputs.base }}
    steps:
      - id: fetch
        run: >-
          python -m judge.ci fetch --server "$GITHUB_SERVER_URL" --repo "$GITHUB_REPOSITORY" --pr "$PR"
          --base-ref "$BASE_REF" --head-sha "$HEAD_SHA" --trees base --admit --workdir w
      - id: admit
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if python -m judge.admit --repo w/repo --base refs/mg/base --head refs/mg/head \
               --policy w/base/.morphogen/policy.json --card-out admission.json; then
            echo "admitted=true" >> "$GITHUB_OUTPUT"
          else
            echo "admitted=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Hand the run its inputs, never the answers
        env:
          CASES_TOKEN: ${{ secrets.MORPHOGEN_CASES_TOKEN }}
        run: |
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$CASES_TOKEN" | base64 -w0)" \
            clone -q --depth 1 "$GITHUB_SERVER_URL/$CASES_REPO.git" cases
          python -m judge.ci inputs --cases-dir cases --admission admission.json --out inputs.jsonl
          rm -rf cases
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: {name: admission, path: "admission.json\ninputs.jsonl", retention-days: 1}

  run:
    needs: admit
    if: needs.admit.outputs.admitted == 'true'
    runs-on: untrusted
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with: {name: admission, path: in}
      - env:
          BASE: ${{ needs.admit.outputs.base }}
        run: >-
          python -m judge.ci fetch --server "$GITHUB_SERVER_URL" --repo "$GITHUB_REPOSITORY" --pr "$PR"
          --base-ref "$BASE_REF" --head-sha "$HEAD_SHA" --expect-base "$BASE" --workdir w
      - name: Run the base, then the candidate, in sandbox containers
        run: |
          mkdir out
          for side in base candidate; do
            python -m judge.run --checkout "w/$side" --inputs in/inputs.jsonl --image "$SANDBOX_IMAGE" --module "$MODULE" \
              --label "$side" --out "out/$side.jsonl" --timeout 5
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: {name: runs, path: out, retention-days: 1}

  score:
    needs: [admit, run]
    if: always() && needs.admit.result == 'success'
    runs-on: trusted
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with: {path: art}
      - env:
          BASE: ${{ needs.admit.outputs.base }}
        run: >-
          python -m judge.ci fetch --server "$GITHUB_SERVER_URL" --repo "$GITHUB_REPOSITORY" --pr "$PR"
          --base-ref "$BASE_REF" --head-sha "$HEAD_SHA" --expect-base "$BASE" --trees base --workdir w
      - id: claim
        env:
          CASES_TOKEN: ${{ secrets.MORPHOGEN_CASES_TOKEN }}
        run: |
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$CASES_TOKEN" | base64 -w0)" \
            clone -q "$GITHUB_SERVER_URL/$CASES_REPO.git" cases
          python -m judge.ci claim --cases-dir cases --admission art/admission/admission.json --token-env CASES_TOKEN
      - name: Score, sign, post
        env:
          BASE: ${{ needs.admit.outputs.base }}
          SERVED: ${{ steps.claim.outputs.served }}
          STATUS_TOKEN: ${{ secrets.MORPHOGEN_STATUS_TOKEN }}
          COSIGN_KEY: ${{ secrets.MORPHOGEN_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.MORPHOGEN_COSIGN_PASSWORD }}
        run: |
          set -eu
          mkdir -p art/runs
          python -m judge.score --base-checkout w/base --cases-dir cases --base-run art/runs/base.jsonl \
            --candidate-run art/runs/candidate.jsonl --admission art/admission/admission.json --served "$SERVED" \
            --repository "$GITHUB_REPOSITORY" --pull-request "$PR" --base-sha "$BASE" --head-sha "$HEAD_SHA" --out verdict.json
          rm -rf cases
          umask 077 && printf '%s' "$COSIGN_KEY" > /tmp/k
          echo '{"mediaType":"application/vnd.dev.sigstore.signingconfig.v0.2+json","rekorTlogConfig":{},"tsaConfig":{}}' > /tmp/sc.json
          cosign sign-blob --yes --key /tmp/k --signing-config /tmp/sc.json --bundle verdict.sigstore.json verdict.json
          rm -f /tmp/k
          python -m judge.ci post --api "$GITHUB_SERVER_URL/api/v1" --repo "$GITHUB_REPOSITORY" --verdict verdict.json \
            --token-env STATUS_TOKEN --target-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/${{ github.run_number }}"
          python -m judge.ci summary --verdict verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: {name: verdict, path: "verdict.json\nverdict.sigstore.json"}
